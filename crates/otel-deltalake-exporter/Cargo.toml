[package]
name = "otel-deltalake-exporter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Delta file backend for the OTEL Arrow Parquet exporter"

[dependencies]
anyhow.workspace = true
arrow-lake = { path = "../arrow-lake", features = ["delta"] }
arrow = { version = "58.3", default-features = false }
async-trait = "0.1"
linkme = "0.3"
parquet = { version = "58.3", default-features = false, features = ["arrow"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
humantime-serde = "1"
otel-arrow-dfe-config = { path = "../../submodules/otel-arrow/rust/otap-dataflow/crates/config" }
otel-arrow-dfe-engine = { path = "../../submodules/otel-arrow/rust/otap-dataflow/crates/engine" }
otel-arrow-dfe-otap = { path = "../../submodules/otel-arrow/rust/otap-dataflow/crates/otap", default-features = false, features = ["crypto-ring"] }
otel-arrow-dfe-core-nodes = { path = "../../submodules/otel-arrow/rust/otap-dataflow/crates/core-nodes", default-features = false, features = ["parquet"] }
otel-arrow-dfe-pdata = { path = "../../submodules/otel-arrow/rust/otap-dataflow/crates/pdata" }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
