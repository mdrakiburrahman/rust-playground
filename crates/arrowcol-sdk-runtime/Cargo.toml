[package]
name = "arrowcol-sdk-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
arrow-array = "=58.4.0"
arrow-flight = { version = "=58.4.0", default-features = false }
arrow-schema = "=58.4.0"
arrow-select = "=58.4.0"
futures = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "sync", "time", "macros"] }
tonic = { version = "=0.14.6", features = ["transport", "tls-ring", "tls-native-roots"] }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
