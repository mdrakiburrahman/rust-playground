[package]
name = "arrow-tenant-stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Checkpointed append-only Delta tenant forks with DataFusion predicate pushdown"

[dependencies]
anyhow.workspace = true
arrow = { version = "58.3", default-features = false }
arrow-deltalake = { path = "../arrow-deltalake" }
async-trait = "0.1"
bytes = "1"
clap.workspace = true
datafusion = { version = "=54.1.0", default-features = false, features = ["parquet"] }
delta_kernel = { version = "=0.29.0", default-features = false, features = ["arrow-58", "internal-api", "arrow-conversion", "arrow-expression"] }
delta_kernel_default_engine = { version = "=0.29.0", default-features = false, features = ["arrow-58"] }
fs2 = "0.4"
futures = "0.3"
object_store = { version = "0.13", features = ["azure"] }
parquet = { version = "58.3", default-features = false, features = ["arrow", "async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time", "macros", "net", "signal"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
