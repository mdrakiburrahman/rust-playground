[package]
name = "lr-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "Long-retention Delta table benchmark: delta-rs 1.1.1, delta-rs main (2.0.0) and delta_kernel 0.30.1"
publish = false

# Standalone: pins two deltalake-core majors and upstream delta_kernel, kept out of the root lockfile.
[workspace]

[[bin]]
name = "lrb"
path = "src/main.rs"

[features]
default = ["dl1", "dl2", "kernel"]
dl1 = ["dep:dl1"]
dl2 = ["dep:dl2"]
kernel = ["dep:delta_kernel", "dep:delta_kernel_default_engine"]
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
tikv-jemallocator = { version = "0.6", optional = true }
anyhow = "1"
arrow = { version = "59", default-features = false, features = ["prettyprint", "json"] }
parquet = { version = "59", default-features = false, features = ["arrow", "async", "object_store", "snap", "zstd"] }
object_store = { version = "0.13.2", features = ["azure", "fs"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
hdrhistogram = "7"
rand = { version = "0.9", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
dl1 = { package = "deltalake-core", version = "=1.1.1", default-features = false, features = ["rustls", "cloud"], optional = true }
dl2 = { package = "deltalake-core", git = "https://github.com/delta-io/delta-rs", rev = "460c90408c6a85af2237ef8b58aefb62d62d1801", default-features = false, features = ["rustls", "cloud"], optional = true }
delta_kernel = { version = "=0.30.1", default-features = false, features = ["arrow-59"], optional = true }
delta_kernel_default_engine = { version = "=0.30.1", default-features = false, features = ["arrow-59", "rustls"], optional = true }

[profile.release]
debug = 1
