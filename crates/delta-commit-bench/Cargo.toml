[package]
name = "delta-commit-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Benchmark of the ArrowCol Delta commit path on Azure storage"
publish = false

[[bin]]
name = "dcb"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap.workspace = true
# Same kernel delta-rs uses; the bench calls its checkpoint directly (--checkpoint-exec blocking).
delta_kernel = { package = "buoyant_kernel", version = "=0.28.1", default-features = false }
deltalake-core = { version = "=1.1.1", default-features = false, features = ["rustls", "cloud"] }
# Upstream kernel for `dcb run --lib kernel`; renamed because `delta_kernel` is buoyant_kernel above.
# Arrow comes from its re-export (`kernel030::arrow`, arrow 59).
kernel030 = { package = "delta_kernel", version = "=0.30.1", default-features = false, features = ["arrow-59"] }
kernel030_engine = { package = "delta_kernel_default_engine", version = "=0.30.1", default-features = false, features = ["arrow-59", "rustls"] }
futures = "0.3"
hdrhistogram = "7"
object_store = { version = "0.13.2", features = ["azure", "fs"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
