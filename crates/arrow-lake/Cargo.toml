[package]
name = "arrow-lake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Streaming pure-Arrow Parquet and Delta Kernel table writers"

[features]
default = ["delta"]
delta = ["dep:delta_kernel", "dep:delta_kernel_default_engine", "dep:fs2", "dep:url"]

[dependencies]
anyhow.workspace = true
arrow = { version = "58.3", default-features = false }
parquet = { version = "58.3", default-features = false, features = ["arrow", "async"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
delta_kernel = { version = "=0.29.0", default-features = false, features = ["arrow-58", "internal-api", "arrow-conversion", "arrow-expression"], optional = true }
delta_kernel_default_engine = { version = "=0.29.0", default-features = false, features = ["arrow-58"], optional = true }
fs2 = { version = "0.4", optional = true }
url = { version = "2", optional = true }

[dev-dependencies]
async-trait = "0.1"
futures = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros"] }

[lints]
workspace = true
