[package]
name = "arrowcol-buffer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded zero-copy Arrow batch buffering and durable publication coordination"
readme = "README.md"

[dependencies]
anyhow.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
arrow = { version = "58.3", default-features = false }
arrowcol-catalog = { path = "../arrowcol-catalog" }
arrowcol-protocol = { path = "../arrowcol-protocol" }
arrowcol-receipts = { path = "../arrowcol-receipts" }
arrow-deltalake = { path = "../arrow-deltalake" }
async-trait = "0.1"
otel-arrow-dfe-quiver = { path = "../../submodules/otel-arrow/rust/otap-dataflow/crates/quiver", default-features = false, features = ["mmap"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
url = "2"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
delta_kernel = { version = "=0.29.0", default-features = false }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
futures = "0.3"
tempfile = "3"

[lints]
workspace = true
