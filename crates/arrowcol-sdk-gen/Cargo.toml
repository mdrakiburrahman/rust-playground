[package]
name = "arrowcol-sdk-gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic Rust and TypeScript SDK generation for Arrowcol catalog schemas"
readme = "README.md"

[dependencies]
arrow-flight = { version = "58.4", default-features = false, features = ["flight-sql"] }
arrow-ipc = { version = "58.4", default-features = false }
arrow-schema = { version = "58.4", default-features = false }
arrowcol-catalog = { path = "../arrowcol-catalog" }
arrowcol-catalog-client = { path = "../arrowcol-catalog-client" }
arrowcol-protocol = { path = "../arrowcol-protocol" }
clap.workspace = true
flate2 = "1"
futures = "0.3"
hex = "0.4"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
prettyplease = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
tar = "0.4"
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tonic = { version = "0.14", features = ["transport"] }

[lints]
workspace = true
