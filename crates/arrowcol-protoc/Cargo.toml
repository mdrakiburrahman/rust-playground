[package]
name = "arrowcol-protoc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Opt-in protoc frontend for the existing Arrowcol SDK generator"
default-run = "arrowcol-protoc"
autoexamples = false

[[bin]]
name = "protoc-gen-arrowcol-example"
path = "examples/team-extension.rs"

[dependencies]
arrowcol-catalog = { path = "../arrowcol-catalog" }
arrowcol-sdk-gen = { path = "../arrowcol-sdk-gen" }
clap.workspace = true
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
prost-build = "0.14"

[lints]
workspace = true
