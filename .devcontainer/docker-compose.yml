services:
  workspace:
    image: ghcr.io/mdrakiburrahman/rust-playground/devcontainer:29128a69bb043e43df06a6f755f03c4a97fb62c154beeef5a1dbd540c1faa4e4
    command: sleep infinity
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ..
        target: /workspaces/rust-playground
        consistency: cached
      - type: bind
        source: ${HOST_AZURE_DIR:?Run the devcontainer initializeCommand first}
        target: /home/vscode/.azure
        read_only: false
      - type: bind
        source: ${HOST_GH_CONFIG_DIR:?Run the devcontainer initializeCommand first}
        target: /home/vscode/.config/gh
        read_only: false
      - type: volume
        source: node_modules
        target: /workspaces/rust-playground/node_modules
      - type: volume
        source: nx_cache
        target: /workspaces/rust-playground/.nx
      - type: volume
        source: rust_target
        target: /workspaces/rust-playground/target

volumes:
  node_modules:
  nx_cache:
  rust_target:
