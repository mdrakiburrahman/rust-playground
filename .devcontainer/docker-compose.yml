services:
  workspace:
    image: ghcr.io/mdrakiburrahman/rust-playground/devcontainer:c1382fc77cf79ef8295f6b0cb83a224476c101a65bfc76d3c8c7542213e222d0
    command: sleep infinity
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ..
        target: /workspaces/rust-playground
        consistency: cached
      - type: bind
        source: ${HOST_AZURE_DIR:?Run the devcontainer initializeCommand first}
        target: /home/vscode/.azure
        read_only: false
      - type: bind
        source: ${HOST_GH_CONFIG_DIR:?Run the devcontainer initializeCommand first}
        target: /home/vscode/.config/gh
        read_only: false
      - type: volume
        source: node_modules
        target: /workspaces/rust-playground/node_modules
      - type: volume
        source: nx_cache
        target: /workspaces/rust-playground/.nx
      - type: volume
        source: rust_target
        target: /workspaces/rust-playground/target

volumes:
  node_modules:
  nx_cache:
  rust_target:
