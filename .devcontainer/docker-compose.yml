services:
  workspace:
    image: ghcr.io/mdrakiburrahman/rust-playground/devcontainer:37ab0c1539f915d5680225c68a0b8b9a0a5001a3f913841d03b55071ec0c9f53
    command: sleep infinity
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ..
        target: /workspaces/rust-playground
        consistency: cached
      - type: bind
        source: ${HOST_AZURE_DIR:?Run the devcontainer initializeCommand first}
        target: /home/vscode/.azure
        read_only: false
      - type: bind
        source: ${HOST_GH_CONFIG_DIR:?Run the devcontainer initializeCommand first}
        target: /home/vscode/.config/gh
        read_only: false
      - type: volume
        source: node_modules
        target: /workspaces/rust-playground/node_modules
      - type: volume
        source: nx_cache
        target: /workspaces/rust-playground/.nx
      - type: volume
        source: rust_target
        target: /workspaces/rust-playground/target

volumes:
  node_modules:
  nx_cache:
  rust_target:
