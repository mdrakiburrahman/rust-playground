name: Publish runtime images

on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/workflows/publish-images.yml
      - bin/hello-world/**
      - projects/loadtest/reader/**
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - nx.json
      - package-lock.json
      - package.json
      - rust-toolchain.toml
      - rustfmt.toml
      - tools/libs/rust-playground-build/**
      - tools/scripts/**
      - tsconfig.json
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish hello-world image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install host CLI dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Smoke-test runtime image
        run: npx --no-install nx run hello-world:image-smoke

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_ENVIRONMENT: ci
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: npx --no-install nx run tools-scripts:registry-login

      - name: Publish SHA and latest tags
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_BRANCH: ${{ github.ref_name }}
          REGISTRY_ENVIRONMENT: ci
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_SHA: ${{ github.sha }}
        run: npx --no-install nx run hello-world:publish:main

      - name: Publish branch and SHA tags
        if: github.ref != 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_BRANCH: ${{ github.ref_name }}
          REGISTRY_ENVIRONMENT: ci
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_SHA: ${{ github.sha }}
        run: npx --no-install nx run hello-world:publish

      - name: Verify immutable SHA manifest
        env:
          REGISTRY_ENVIRONMENT: ci
          REGISTRY_IMAGE: hello-world
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_TAG: sha-${{ github.sha }}
        run: npx --no-install nx run tools-scripts:registry-manifest

      - name: Verify latest manifest
        if: github.ref == 'refs/heads/main'
        env:
          REGISTRY_ENVIRONMENT: ci
          REGISTRY_IMAGE: hello-world
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_TAG: latest
        run: npx --no-install nx run tools-scripts:registry-manifest
