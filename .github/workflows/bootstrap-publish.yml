name: Bootstrap publish

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read
  packages: write

concurrency:
  group: bootstrap-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install host CLI dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_ENVIRONMENT: ci
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: npx --no-install nx run tools-scripts:registry-login

      - name: Publish immutable devcontainer
        env:
          GITHUB_REF_NAME: ${{ github.head_ref }}
        run: npx --no-install nx run devcontainer:publish

      - name: Publish branch and SHA runtime image
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --no-install nx run hello-world:publish

      - name: Verify devcontainer manifest
        env:
          REGISTRY_ENVIRONMENT: ci
          REGISTRY_IMAGE: devcontainer
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_TAG: d84da0b0dffa796063b6748360647001c3b29521c0c547dcf4f4faf6d7b5a2fd
        run: npx --no-install nx run tools-scripts:registry-manifest

      - name: Verify runtime SHA manifest
        env:
          REGISTRY_ENVIRONMENT: ci
          REGISTRY_IMAGE: hello-world
          REGISTRY_OWNER: ${{ github.repository_owner }}
          REGISTRY_TAG: sha-${{ github.event.pull_request.head.sha }}
        run: npx --no-install nx run tools-scripts:registry-manifest
