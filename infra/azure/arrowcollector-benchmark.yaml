  name: arrowcol-catalog-fresh
  namespace: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    benchmark-stage: sql
spec:
  accessModes:
    - ReadWriteOnce
