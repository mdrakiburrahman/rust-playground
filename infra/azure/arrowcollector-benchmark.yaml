apiVersion: apps/v1
kind: Deployment
metadata:
  name: arrowcol-catalog
  namespace: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    benchmark-stage: catalog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arrowcol-catalog
  template:
    metadata:
      labels:
        app: arrowcol-catalog
        app.kubernetes.io/part-of: arrowcol-oat
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: arrow-collector
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        arrow-collector/role: support
        kubernetes.io/arch: amd64
      tolerations:
        - key: arrow-collector/role
          operator: Equal
          value: support
          effect: NoSchedule
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 360
      containers:
        - name: catalog
          image: arrowcollector68590.azurecr.io/arrowcol-catalog-rust@sha256:7c9030311da40ed3098574ff87bc47fb87bd596525d02fe654645ca555cdf300
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --warehouse-root
            - abfss://arrowcol@arrowcollector68590.dfs.core.windows.net/direct-baseline-1/runs/BENCHRUNUUID/dataflow
            - --state-dir
            - /data/catalog
            - --ingestion-layout
            - --ddl-identity-secret-file
            - /run/auth/internal-hmac
          env:
            - name: ARROWCOL_DELTA_ROOT
              value: abfss://arrowcol@arrowcollector68590.dfs.core.windows.net/direct-baseline-1/runs/BENCHRUNUUID/dataflow
            - name: ARROWCOL_AZURE_MODE
              value: stamped
            - name: AZURE_SUBSCRIPTION_ID
              value: 68fa0545-661c-4152-93f2-fc8ae1c231b8
            - name: AZURE_STAMP
              value: "68590"
            - name: AZURE_RESOURCE_GROUP
              value: arrow-collector-rg
            - name: AZURE_STORAGE_ACCOUNT
              value: arrowcollector68590
            - name: AZURE_STORAGE_CHECKPOINT_CONTAINER
              value: checkpoints
            - name: ARROWCOL_RESET_GENERATION
              valueFrom:
                secretKeyRef:
                  name: arrowcol-generation
                  key: generation
            - name: ARROWCOL_CATALOG_DDL_IDENTITY_SECRET_FILE
              value: /run/auth/internal-hmac
          ports:
            - containerPort: 8817
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
