# Direct ArrowCollector benchmark for AKS context arrow-collector-68590.
# A staged deployment, not a single apply. Use only a new isolated benchmark namespace.
# Render BENCHRUNUUID as a fresh lowercase UUID and BENCHRUNHEX as its 32 lowercase hex digits.
# Render BENCHCLIENTCOUNT as 1, 2, 4, or 8 for a bounded indexed client Job; never exceed ready client nodes.
# Render BENCHOWNER as the approved custody owner in both identity annotations and labels.
# 9876543210000 is a placeholder, not a usable expiry. Immediately before applying
# the initializer stage, replace it in rendered.yaml with current UTC Unix ms + 2700000
# (45 minutes; within the configured 1-hour maximum). Do not compute it at initial
# render if identity/SQL startup will consume that budget. Wait for initializer completion.
# Validate the selected Delta root is empty; never reuse an old run UUID or delete its data.
# Before workload apply, use the sanctioned run-FIC prepare/probe in docs/operations/OAT_RUN_AUTHORITY.md
# for this exact namespace UID and arrow-collector ServiceAccount; cleanup removes that FIC.
# From the repo root, set UUID to the rendered run ID and NS to arrow-collector-<UUID without hyphens>.
# Set BOOTSTRAP_ENV and STAMP_CONFIG to approved private input files for this stamp.
# Set FIC_RECORD to a durable private path unique to this run (retain it through cleanup).
# npx --no-install tsx infra/azure/bootstrap.ts prepare-run-fic --mode stamped --env-file "$BOOTSTRAP_ENV" --stamp-config "$STAMP_CONFIG" --run-id "$UUID" --namespace "$NS" --service-account arrow-collector --record "$FIC_RECORD"
# npx --no-install tsx infra/azure/bootstrap.ts probe-run-fic --mode stamped --env-file "$BOOTSTRAP_ENV" --stamp-config "$STAMP_CONFIG" --run-id "$UUID" --namespace "$NS" --service-account arrow-collector --record "$FIC_RECORD" --wait-seconds 300
# Do not use the unrelated native namespace or copy its credentials. The stamp workload identity
# client/tenant IDs below are identifiers, not credentials. Review sku-pools-breakthrough.bicepparam
# with a fresh Bicep what-if before any separately authorized deployment. It stages up to eight D64
# clients, one D64 support node, one E192 collector node, and the explicitly enabled ACS v2 installer.
# The workload identity must have sanctioned access. Existing client/profile args below remain
# diagnostic shared replay; do not score them until L3 supplies the realistic calibrated profile.
# The pinned images still retain pre-integration capacity limits; do not qualify until L1b/L3
# provide source-matched images and the bounded capacity/message settings are read back.
# The 160 DFE / 176 CPU candidate is staged only; verify actual E192 allocatable CPU before applying.
# Pre-SC gate: verify a Ready collector node has label kubernetes.azure.com/agentpool=arrowe192 and
# inventory every StorageClass with provisioner localdisk.csi.acstor.io read-only. Do not mutate others.
# Any unannotated class or affinity admitting nodes outside arrowe192 blocks this run because it can
# widen CSI placement. Reuse an existing same-name run class read-only only if run-id, owner-token,
# provisioner, and affinity exactly match; otherwise abort, never overwrite/adopt another owner.
# ACS v2 defers CSI installation until this run-specific StorageClass exists. After creating it,
# before any local-csi test PVC or writer, verify driver pod placement and collector NoSchedule-taint
# tolerance, actual extension/driver versions, and usable NVMe capacity. Record versions before/after
# each scored window; ACS minor/patch pinning is unsupported. What-if cannot validate any of this.
# Supply Secrets in this namespace from your approved secret source (no values in this file):
# arrowcol-generation[generation] (current stamp authority generation), arrowcol-router-auth
# [edge-hmac,internal-hmac], arrowcol-sql-{admin,migration,runtime}[password] (fresh generated SQL credentials).
# Apply with: kubectl --context arrow-collector-68590 apply --server-side -f rendered.yaml -l benchmark-stage=STAGE
# Stages, in order (wait for success; abort on failure):
# identity -> prepare/probe FIC and install Secrets -> storage (create the unique run-scoped cluster StorageClass only if absent;
# exact own match may be reused read-only; run the storage checks above before any local-csi PVC/writer)
# -> sql (wait deploy/arrowcol-sql) -> migration
# (wait job/arrowcol-migrate-v11-fresh) -> catalog (wait catalog/router/maintenance deployments)
# -> writer (one ready pod and stable restart count) -> initializer (wait job/direct-pin-live)
# -> registration (wait job/direct-catalog-verified and verify signed one-table receipt)
# -> load (wait for OAT_CLIENT_READY from every indexed client pod, then patch
# direct-schedule-confirmwide .data.start to Unix ms at least 125 s in the future). Monitor the same writer
# pod UID/restart count throughout; stop this load Job if the writer becomes unhealthy.
# Capture 60 s warmup, 600 s timed commits, then drain. The Job has a hard deadline.
# Each scored 600 s window needs a fresh run UUID, namespace, FIC and independent initialization; this
# one rendered run is not two-window qualification. Repeat only after source/image readiness and approval.
# Each admitted external push_batch receives a new PublicationId: scored clients must use L3's verified
# single-attempt/no-resubmission path; any failed or ambiguous logical send invalidates the entire scored window (no partial credit).
# Local NVMe is a bounded 256 Gi staging area via TMPDIR, not durable storage or an acknowledgment.
# No QAP/Kusto consumer is deployed here. Keep cluster-scoped cleanup separate from namespace/FIC cleanup.
# After drain, remove the StorageClass only if exact run-id and owner-token labels match and no PVC/PV uses it. Never remove the shared ACS extension as routine run cleanup. Preserve Delta objects and verify pools physically return to zero.
# Isolated development benchmark only, not a production deployment or authentication recipe.
# HMAC-authenticated internal traffic is not TLS; retain the supplied workload identity,
# Secrets and network policies. native_quiver is false (memory-only buffering).
# Diagnostic shared replay of synthetic rows, not realistic telemetry or unique-row delivery.
---
apiVersion: v1
kind: Namespace
metadata:
  name: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    arrowcol-oat/run-id: BENCHRUNUUID
    arrowcol-oat/owner-token: BENCHOWNER
    benchmark-stage: identity
  annotations:
    arrowcol-oat/run-id: BENCHRUNUUID
    arrowcol-oat/owner-token: BENCHOWNER
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: arrowcol-BENCHRUNHEX-local-csi
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    benchmark-stage: storage
    arrowcol-oat/run-id: BENCHRUNUUID
    arrowcol-oat/owner-token: BENCHOWNER
  annotations:
    storageoperator.acstor.io/nodeAffinity: |
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.azure.com/agentpool
            operator: In
            values: [arrowe192]
provisioner: localdisk.csi.acstor.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arrow-collector
  namespace: arrow-collector-BENCHRUNHEX
  annotations:
    azure.workload.identity/client-id: 1aec6cf9-f7f4-4c14-a3da-5e4bae1de278
    arrowcol-oat/run-id: BENCHRUNUUID
    arrowcol-oat/owner-token: BENCHOWNER
  labels:
    arrowcol-oat/run-id: BENCHRUNUUID
    arrowcol-oat/owner-token: BENCHOWNER
    benchmark-stage: identity
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    benchmark-stage: sql
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sql-internal
  namespace: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    benchmark-stage: sql
spec:
  podSelector:
    matchLabels:
      app: arrowcol-sql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: arrowcol
        - podSelector:
            matchLabels:
              app: arrowcol-router
        - podSelector:
            matchLabels:
              app: arrowcol-migrate
        - podSelector:
            matchLabels:
              app: arrowcol-oat-pin-init
      ports:
        - protocol: TCP
          port: 1433
---
apiVersion: v1
kind: Service
metadata:
  name: arrowcol-sql
  namespace: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    benchmark-stage: sql
spec:
  type: ClusterIP
  selector:
    app: arrowcol-sql
  ports:
    - port: 1433
      targetPort: 1433
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arrowcol-sql-fresh
  namespace: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
