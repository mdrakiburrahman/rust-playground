---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arrowcol-sql
  namespace: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    benchmark-stage: sql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arrowcol-sql
  template:
    metadata:
      labels:
        app: arrowcol-sql
        app.kubernetes.io/part-of: arrowcol-oat
    spec:
      serviceAccountName: arrow-collector
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        arrow-collector/role: support
        kubernetes.io/arch: amd64
      tolerations:
        - key: arrow-collector/role
          operator: Equal
          value: support
          effect: NoSchedule
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 360
      containers:
        - name: sqlserver
          image: arrowcollector68590.azurecr.io/arrowcol-sqlserver@sha256:bb8f334a5287326345be56fb5722c28c6995051b8ee5aff4426bc3e38acd5b97
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "2048"
            - name: MSSQL_SA_PASSWORD_FILE
              value: /run/sa/password
          ports:
            - containerPort: 1433
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            exec:
              command:
                - /usr/local/bin/sqlserver-healthcheck
            timeoutSeconds: 8
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/sqlserver-healthcheck
            timeoutSeconds: 8
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
              readOnly: false
            - name: sa
              mountPath: /run/sa
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: arrowcol-sql-fresh
        - name: sa
          secret:
            secretName: arrowcol-sql-admin
            defaultMode: 288
---
apiVersion: batch/v1
kind: Job
metadata:
  name: arrowcol-migrate-v11-fresh
  namespace: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    benchmark-stage: migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: arrowcol-migrate
        app.kubernetes.io/part-of: arrowcol-oat
    spec:
      serviceAccountName: arrow-collector
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        arrow-collector/role: support
        kubernetes.io/arch: amd64
      tolerations:
        - key: arrow-collector/role
          operator: Equal
          value: support
          effect: NoSchedule
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 360
      containers:
        - name: migrate
          image: arrowcollector68590.azurecr.io/arrowcol-sqlserver@sha256:bb8f334a5287326345be56fb5722c28c6995051b8ee5aff4426bc3e38acd5b97
          command:
            - /usr/local/bin/arrowcol-migrate
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: SQLSERVER_HOST
              value: arrowcol-sql
            - name: ARROWCOL_MIGRATOR_PASSWORD_FILE
              value: /run/migration/password
          volumeMounts:
            - name: migration
              mountPath: /run/migration
              readOnly: true
      volumes:
        - name: sa
          secret:
            secretName: arrowcol-sql-admin
            defaultMode: 288
        - name: app
          secret:
            secretName: arrowcol-sql-runtime
            defaultMode: 288
        - name: migration
          secret:
            secretName: arrowcol-sql-migration
            defaultMode: 288
      restartPolicy: Never
      initContainers:
        - name: bootstrap
          image: arrowcollector68590.azurecr.io/arrowcol-sqlserver@sha256:bb8f334a5287326345be56fb5722c28c6995051b8ee5aff4426bc3e38acd5b97
          command:
            - /usr/local/bin/database-bootstrap
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: SQLSERVER_HOST
              value: arrowcol-sql
            - name: SQLSERVER_SA_PASSWORD_FILE
              value: /run/sa/password
            - name: ARROWCOL_APP_PASSWORD_FILE
              value: /run/app/password
            - name: ARROWCOL_MIGRATOR_PASSWORD_FILE
              value: /run/migration/password
          volumeMounts:
            - name: sa
              mountPath: /run/sa
              readOnly: true
            - name: app
              mountPath: /run/app
              readOnly: true
            - name: migration
              mountPath: /run/migration
              readOnly: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arrowcol-config
  namespace: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    benchmark-stage: catalog
data:
  dataflow.yaml: |
    version: otel_dataflow/v1
    engine:
      shutdown_drain_timeout_seconds: ${env:ARROWCOL_COLLECTOR_SHUTDOWN_DRAIN_TIMEOUT_SECONDS:-60}
    policies:
      resources:
        core_allocation:
          type: core_count
          count: 160
    groups:
      arrowcol:
        pipelines:
          ingest:
            policies:
              channel_capacity:
                control:
                  node: 64
                  pipeline: 64
                pdata: 32
            nodes:
              flight:
                type: receiver:arrow_flight
                config:
                  listening_addr: ${env:ARROWCOL_FLIGHT_LISTEN:-0.0.0.0:32010}
                  admin_listening_addr: ${env:ARROWCOL_ADMIN_LISTEN:-0.0.0.0:32011}
                  native_quiver: false
                  catalog:
                    type: remote
                    endpoint: ${env:ARROWCOL_CATALOG_ENDPOINT:-http://arrowcol-catalog:8817}
                    maximum_cache_age: 10s
                  routing:
                    type: sql_server
                    connection:
                      host: ${env:ARROWCOL_SQL_HOST:-sqlserver}
                      port: ${env:ARROWCOL_SQL_PORT:-1433}
                      database: ${env:ARROWCOL_SQL_DATABASE:-arrowcol}
                      username: ${env:ARROWCOL_SQL_USERNAME:-arrowcol_app}
                      password_file: ${env:ARROWCOL_SQL_PASSWORD_FILE:-/run/secrets/arrowcol-app-password}
                      trust_server_certificate: ${env:ARROWCOL_SQL_TRUST_CERT:-true}
                      connect_timeout: 15s
                      command_timeout: 30s
                  registration:
                    instance_key: ${env:ARROWCOL_INSTANCE_KEY:-arrowcol-dataflow-local}
                    flight_endpoint: ${env:ARROWCOL_ADVERTISED_FLIGHT_ENDPOINT:-127.0.0.1:32010}
                    max_concurrent_streams: 256
                    heartbeat_interval: 5s
                    pressure_interval: 2s
                    registration_ttl: 30s
                    rss_limit_bytes: 343597383680
                    buffered_bytes_limit: 4290000000
                    buffered_rows_limit: 25000000
                    buffered_batches_limit: 16384
                  limits:
                    max_metadata_bytes: 16384
                    max_schema_bytes: 1048576
                    max_message_bytes: ${env:ARROWCOL_MAX_MESSAGE_BYTES:-16777216}
                    batch_channel_capacity: 4
                    put_result_channel_capacity: 16
                    max_stream_duration: 5m
                    admission_timeout: 30s
                    max_ddl_bytes: 65536
              delta:
                type: exporter:arrow_deltalake
                config:
                  base_path: ${env:ARROWCOL_DELTA_ROOT:-/onelake}
                  routing:
                    type: sql_server
                    connection:
                      host: ${env:ARROWCOL_SQL_HOST:-sqlserver}
                      port: ${env:ARROWCOL_SQL_PORT:-1433}
                      database: ${env:ARROWCOL_SQL_DATABASE:-arrowcol}
                      username: ${env:ARROWCOL_SQL_USERNAME:-arrowcol_app}
                      password_file: ${env:ARROWCOL_SQL_PASSWORD_FILE:-/run/secrets/arrowcol-app-password}
                      trust_server_certificate: ${env:ARROWCOL_SQL_TRUST_CERT:-true}
                      connect_timeout: 15s
                      command_timeout: 30s
                  commit:
                    batch_window: 2s
                    max_files_per_commit: 128
                    max_pending_files: 512
                  batching:
                    global_capacity:
                      bytes: 4290000000
                      rows: 25000000
                      batches: 16384
                    per_table_capacity:
                      bytes: 4000000000
                      rows: 12000000
                      batches: 8192
                    max_arrow_memory_per_flush: 1073741824
                    max_rows_per_flush: 2000000
                    max_batches_per_flush: 2048
                    max_age: 60s
                    max_concurrent_flushes: 12
                    adaptive_file:
                      target_parquet_bytes: 134217728
                      min_input_bytes: 1048576
                      max_input_bytes: 1073741824
                      cold_start_parquet_ratio: 0.25
                      ewma_weight: 0.2
                      min_parquet_ratio: 0.015625
                      max_parquet_ratio: 4
                    coalesce_publications: true
                    age_flush_policy: drain_ready
                    pipeline_depth: 8
                  authority_timeout: 10s
            connections:
              - from: flight
                to: delta
  router.yaml: |
    server:
      listen: 0.0.0.0:50050
      threads: 4
      listener_tasks_per_fd: 1
      grace_period_seconds: 10
      graceful_shutdown_timeout_seconds: 300
      state_directory: /var/run/arrowcol-router
      h2:
        max_concurrent_streams: 512
        stream_window_bytes: 1048576
        connection_window_bytes: 33554432
        idle_timeout_seconds: 60
    sql_server:
      host: arrowcol-sql
      port: 1433
      database: arrowcol
      username: arrowcol_app
      password_file: /run/app/password
      trust_server_certificate: true
      connect_timeout_ms: 5000
      command_timeout_ms: 15000
    routing:
      refresh_interval_ms: 1000
      max_snapshot_age_ms: 15000
      max_future_skew_ms: 2000
      max_table_entries: 256
      max_oldest_buffer_age_ms: 86400000
      hard_pressure_bps: 9500
      warmup_ms: 1000
      minimum_warmup_bps: 1000
      lease_ttl_ms: 3600000
      readiness_max_staleness_ms: 30000
      distinct_table_owners: false
    auth:
      authenticator: dev_only_allow_all
      edge_secret_file: /run/auth/edge-hmac
      internal_signing_secret_file: /run/auth/internal-hmac
      edge_signature_max_age_ms: 30000
      internal_identity_ttl_ms: 30000
    upstream:
      tls: false
      sni: ""
      max_h2_streams: 1
      stream_window_bytes: 1048576
      connection_window_bytes: 33554432
      connection_timeout_ms: 1000
      total_connection_timeout_ms: 3000
      idle_timeout_seconds: 0
      ping_interval_seconds: 15
    telemetry:
      log_filter: info,arrowcol_router_rust=debug
      json_logs: true
