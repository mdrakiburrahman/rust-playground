# Copy to infra/azure/stamp.yaml, set the subscription UUID, and verify address ranges against every connected network.
subscription: 00000000-0000-0000-0000-000000000000
# 1..999999, or the quoted '00000': arrow-collector-<stamp> must fit Kusto's 22-character name limit.
stamp: 1
storageReadLogDestination: storage
resourceGroup: arrow-collector-rg
location: eastus2
aks:
  version: 1.35.6
  skuTier: Free
  namespace: arrow-collector
  serviceAccount: arrow-collector
  systemPool:
    name: systempool
    vmSize: Standard_D8ds_v6
    initialCount: 3
    minCount: 3
    maxCount: 3
    maxPods: 250
    availabilityZones: ["1", "2", "3"]
  # User pools autoscale from zero; role sets the arrow-collector/role label and NoSchedule taint.
  userPools:
    - name: benchd64
      role: client
      vmSize: Standard_D64ds_v6
      initialCount: 0
      minCount: 0
      maxCount: 1
      maxPods: 250
      availabilityZones: []
    - name: benche64
      role: arrowcol
      vmSize: Standard_E64ds_v6
      initialCount: 0
      minCount: 0
      maxCount: 1
      maxPods: 250
      availabilityZones: []
  network:
    vnetIpv4Cidr: 10.245.0.0/16
    vnetIpv6Cidr: fd20:245::/48
    nodeSubnetIpv4Cidr: 10.245.0.0/24
    nodeSubnetIpv6Cidr: fd20:245:0:1::/64
    apiServerSubnetIpv4Cidr: 10.245.1.0/28
    podIpv4Cidr: 10.246.0.0/16
    podIpv6Cidr: fd20:245:1::/64
    serviceIpv4Cidr: 10.247.0.0/16
    serviceIpv6Cidr: fd20:245:2::/108
    dnsServiceIp: 10.247.0.10
    # Set only IP allocation tags authorized for the target subscription.
    egressIpv4IpTags: []
    egressIpv6IpTags: []
# Populate from the preserved current publisher FIC inventory before retiring old identities.
publisherFederatedCredentials: []