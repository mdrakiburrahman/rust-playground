apiVersion: batch/v1
kind: Job
metadata:
  name: azure-qap
  namespace: azure-qap
  labels:
    app.kubernetes.io/name: azure-qap
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azure-qap
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: azure-qap
      tolerations:
        - key: CriticalAddonsOnly
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        fsGroup: 10001
      restartPolicy: Never
      terminationGracePeriodSeconds: 360
      containers:
        - name: experiment
          image: qap-runtime:latest
          imagePullPolicy: IfNotPresent
          args: []
          envFrom:
            - configMapRef:
                name: azure-qap-env
          env:
            - name: ARROWCOL_RESET_GENERATION
              valueFrom:
                secretKeyRef:
                  name: azure-qap-secret
                  key: ARROWCOL_RESET_GENERATION
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          emptyDir: {}
        - name: tmp
          emptyDir: {}