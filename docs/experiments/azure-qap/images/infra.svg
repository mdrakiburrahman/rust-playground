<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="infra-title infra-desc" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="infra-title">Azure resources used by the QAP experiment</title>
<desc id="infra-desc">The devcontainer runs nx targets against one resource group, rust-playground. It holds the managed identity arrowcol-kusto-reader, the Kusto cluster arrowcol-&lt;sandboxId&gt; with databases arrowcol and the new experimentqap, the storage account arrowcol&lt;sandboxId&gt; with containers arrowcol, checkpoints and the new experimentqap, a new StorageRead diagnostic setting, and a new Log Analytics workspace arrowcol-&lt;sandboxId&gt;. Three new role assignments let the identity read the container and view the database, and let the operator read the logs.</desc>
<defs>
<marker id="infra-ar-ink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#526278"/></marker>
<marker id="infra-ar-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#c8283c"/></marker>
<marker id="infra-ar-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#185abd"/></marker>
<marker id="infra-ar-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#1f7a45"/></marker>
<marker id="infra-ar-amber" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#b78919"/></marker>
<marker id="infra-ar-purple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#6b3fb5"/></marker>
</defs>
<rect x="1" y="1" width="998" height="928" rx="16" fill="#ffffff" stroke="#d5dfea" stroke-width="1.5"/>
<text x="28" y="46" font-size="25" font-weight="700" fill="#18263a">Azure resources for the experiment</text>
<text x="28" y="74" font-size="15" fill="#526278">One shared sandbox. Green boxes are NEW for this experiment; grey ones were already there.</text>
<rect x="20" y="96" width="232" height="352" rx="14" fill="#e9eff9" stroke="#185abd" stroke-width="2"/>
<text x="36" y="128" font-size="19" font-weight="700" fill="#185abd">Devcontainer</text>
<text x="36" y="150" font-size="13" fill="#526278">your az login (operator)</text>
<rect x="34" y="166" width="204" height="58" rx="8" fill="#ffffff" stroke="#185abd" stroke-width="1.8"/>
<text x="46" y="190" font-size="13.5" font-weight="700" fill="#18263a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">azure-infra:provision</text>
<text x="46" y="210" font-size="12.5" fill="#526278">deploys main.bicep (ARM)</text>
<rect x="34" y="234" width="204" height="58" rx="8" fill="#ffffff" stroke="#185abd" stroke-width="1.8"/>
<text x="46" y="258" font-size="13.5" font-weight="700" fill="#18263a">loadtest (Azure mode)</text>
<text x="46" y="278" font-size="12.5" fill="#526278">ArrowCol writers, arrowcol</text>
<rect x="34" y="302" width="204" height="58" rx="8" fill="#dff4e5" stroke="#25834b" stroke-width="1.8"/>
<text x="46" y="326" font-size="13.5" font-weight="700" fill="#18263a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">azure-qap-experiment:run</text>
<text x="46" y="346" font-size="12.5" fill="#526278">this experiment</text>
<rect x="34" y="370" width="204" height="58" rx="8" fill="#ffffff" stroke="#185abd" stroke-width="1.8"/>
<text x="46" y="394" font-size="13.5" font-weight="700" fill="#18263a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">azure-infra:reset</text>
<text x="46" y="414" font-size="12.5" fill="#526278">wipes data (with --execute)</text>
<rect x="272" y="86" width="708" height="820" rx="18" fill="#fcfdff" stroke="#8fa3bc" stroke-width="2" stroke-dasharray="8 6"/>
<text x="292" y="116" font-size="18" font-weight="700" fill="#18263a">Resource group: rust-playground</text>
<text x="292" y="136" font-size="12.5" fill="#526278">one Bicep deployment · names follow arrowcol-&lt;sandboxId&gt;</text>
<rect x="292" y="154" width="300" height="70" rx="12" fill="#f4f6f9" stroke="#8fa3bc" stroke-width="1.8"/>
<text x="308" y="180" font-size="15" font-weight="700" fill="#18263a">Managed identity</text>
<text x="308" y="200" font-size="12.5" fill="#18263a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">arrowcol-kusto-reader</text>
<text x="308" y="216" font-size="12" fill="#526278">Kusto reads storage as this identity</text>
<rect x="292" y="252" width="316" height="312" rx="14" fill="#f4f6f9" stroke="#8fa3bc" stroke-width="2"/>
<rect x="306" y="266" width="30" height="30" rx="9" fill="#6b3fb5" stroke="#6b3fb5" stroke-width="1.5"/>
<rect x="311.6" y="282.5" width="4.3" height="8.1" rx="1.5" fill="#ffffff" stroke="none" stroke-width="0"/>
<rect x="318.9" y="275" width="4.3" height="15.6" rx="1.5" fill="#ffffff" stroke="none" stroke-width="0"/>
<rect x="326.1" y="278.6" width="4.3" height="12" rx="1.5" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="346" y="280" font-size="15.5" font-weight="700" fill="#18263a">Kusto: arrowcol-&lt;sandboxId&gt;</text>
<text x="346" y="298" font-size="12" fill="#526278">E4ads_v5 · autoscale 2–4 · unchanged</text>
<rect x="306" y="314" width="288" height="96" rx="10" fill="#ffffff" stroke="#8fa3bc" stroke-width="1.5"/>
<text x="320" y="338" font-size="14.5" font-weight="700" fill="#18263a">database: arrowcol</text>
<text x="320" y="358" font-size="12.5" fill="#526278">loadtest external Delta tables + QAP</text>
<text x="320" y="376" font-size="12.5" fill="#526278">identity: Viewer</text>
<text x="320" y="394" font-size="12.5" fill="#526278">reset deletes it; provision recreates</text>
<rect x="306" y="424" width="288" height="124" rx="10" fill="#dff4e5" stroke="#25834b" stroke-width="2"/>
<text x="320" y="448" font-size="14.5" font-weight="700" fill="#1f7a45">NEW database: experimentqap</text>
<text x="320" y="470" font-size="12.5" fill="#18263a">per-run external Delta tables</text>
<text x="320" y="488" font-size="12.5" fill="#18263a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">qap_&lt;runId&gt;_&lt;trial&gt; + QAP</text>
<text x="320" y="508" font-size="12.5" fill="#18263a">run drops its tables, even on failure</text>
<text x="320" y="528" font-size="12.5" fill="#18263a">reset: drops objects, keeps DB + policy</text>
<rect x="648" y="154" width="312" height="330" rx="14" fill="#f4f6f9" stroke="#8fa3bc" stroke-width="2"/>
<text x="664" y="180" font-size="15.5" font-weight="700" fill="#18263a">Storage: arrowcol&lt;sandboxId&gt;</text>
<text x="664" y="198" font-size="12" fill="#526278">existing ADLS Gen2 (HNS), reused</text>
<rect x="662" y="212" width="284" height="50" rx="8" fill="#ffffff" stroke="#8fa3bc" stroke-width="1.5"/>
<path d="M674,224 h6 l2,2.5 h10 v11.5 h-18 z" fill="#fff1cc" stroke="#b78919" stroke-width="1.3" stroke-linejoin="round"/>
<text x="698" y="235" font-size="13.5" font-weight="700" fill="#18263a">container: arrowcol</text>
<text x="698" y="253" font-size="12" fill="#526278">loadtest Delta tables</text>
<rect x="662" y="270" width="284" height="50" rx="8" fill="#ffffff" stroke="#8fa3bc" stroke-width="1.5"/>
<path d="M674,282 h6 l2,2.5 h10 v11.5 h-18 z" fill="#fff1cc" stroke="#b78919" stroke-width="1.3" stroke-linejoin="round"/>
<text x="698" y="293" font-size="13.5" font-weight="700" fill="#18263a">container: checkpoints</text>
<text x="698" y="311" font-size="12" fill="#526278">writer state</text>
<rect x="662" y="330" width="284" height="140" rx="8" fill="#dff4e5" stroke="#25834b" stroke-width="2"/>
<path d="M674,342 h6 l2,2.5 h10 v11.5 h-18 z" fill="#fff1cc" stroke="#b78919" stroke-width="1.3" stroke-linejoin="round"/>
<text x="698" y="353" font-size="13.5" font-weight="700" fill="#1f7a45">NEW container: experimentqap</text>
<text x="676" y="376" font-size="12" fill="#18263a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">runs/&lt;runId&gt;/&lt;trial&gt;/</text>
<text x="676" y="394" font-size="12" fill="#18263a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  _delta_log/*.json</text>
<text x="676" y="412" font-size="12" fill="#18263a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  __arrowcol_ingestion=…/*.parquet</text>
<text x="676" y="438" font-size="12" fill="#1f7a45">server-side copies, deleted by the run</text>
<text x="676" y="456" font-size="12" fill="#1f7a45">even on failure; reset empties it</text>
<rect x="648" y="512" width="312" height="70" rx="12" fill="#dff4e5" stroke="#25834b" stroke-width="2"/>
<text x="664" y="538" font-size="14.5" font-weight="700" fill="#1f7a45">NEW diagnostic setting</text>
<text x="664" y="558" font-size="12.5" fill="#18263a">blob service → StorageRead logs only</text>
<text x="664" y="574" font-size="12" fill="#526278">(who read which file, how many bytes)</text>
<rect x="648" y="614" width="312" height="92" rx="12" fill="#dff4e5" stroke="#25834b" stroke-width="2"/>
<text x="664" y="640" font-size="14.5" font-weight="700" fill="#1f7a45">NEW Log Analytics workspace</text>
<text x="664" y="658" font-size="12.5" fill="#18263a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">arrowcol-&lt;sandboxId&gt;</text>
<text x="664" y="678" font-size="12.5" fill="#18263a">table StorageBlobLogs, 2–10 min late</text>
<text x="664" y="696" font-size="12" fill="#526278">filter: experimentqap/runs/&lt;runId&gt;/</text>
<rect x="292" y="726" width="668" height="164" rx="14" fill="#ffffff" stroke="#d5dfea" stroke-width="1.5"/>
<text x="308" y="752" font-size="16" font-weight="700" fill="#18263a">Role assignments</text>
<text x="308" y="776" font-size="12.5" font-weight="700" fill="#526278">existing</text>
<text x="378" y="776" font-size="12.5" fill="#526278">identity → Storage Blob Data Reader on container arrowcol</text>
<text x="308" y="795" font-size="12.5" font-weight="700" fill="#526278">existing</text>
<text x="378" y="795" font-size="12.5" fill="#526278">operator → Storage Blob Data Contributor on the account; Kusto AllDatabasesAdmin</text>
<text x="308" y="814" font-size="12.5" font-weight="700" fill="#526278">existing</text>
<text x="378" y="814" font-size="12.5" fill="#526278">identity → Viewer on database arrowcol</text>
<text x="308" y="833" font-size="12.5" font-weight="700" fill="#1f7a45">NEW</text>
<text x="378" y="833" font-size="12.5" font-weight="600" fill="#1f7a45">identity → Storage Blob Data Reader on container experimentqap</text>
<text x="308" y="852" font-size="12.5" font-weight="700" fill="#1f7a45">NEW</text>
<text x="378" y="852" font-size="12.5" font-weight="600" fill="#1f7a45">identity → Viewer on database experimentqap</text>
<text x="308" y="871" font-size="12.5" font-weight="700" fill="#1f7a45">NEW</text>
<text x="378" y="871" font-size="12.5" font-weight="600" fill="#1f7a45">operator → Log Analytics Reader on arrowcol-&lt;sandboxId&gt;</text>
