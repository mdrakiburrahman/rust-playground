<text x="265" y="281" font-size="12" font-weight="700" fill="#6b778a" text-anchor="middle">watch</text>
<path d="M326,268 l14,14 m0,-14 l-14,14" fill="none" stroke="#c8283c" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
<text x="350" y="281" font-size="12.5" font-weight="700" fill="#c8283c" stroke="#f7f9fc" stroke-width="5" stroke-linejoin="round" paint-order="stroke">stops here and reports 0 rereads (wrong)</text>
<rect x="210" y="322" width="110" height="28" rx="6" fill="#e9eff9" stroke="#185abd" stroke-width="1.8"/>
<text x="265" y="341" font-size="12" font-weight="700" fill="#185abd" text-anchor="middle">wait</text>
<rect x="320" y="322" width="110" height="28" rx="6" fill="#e9eff9" stroke="#185abd" stroke-width="1.8"/>
<text x="375" y="341" font-size="12" font-weight="700" fill="#185abd" text-anchor="middle">tail</text>
<rect x="430" y="322" width="200" height="28" rx="6" fill="#e9eff9" stroke="#c8283c" stroke-width="1.8"/>
<text x="530" y="341" font-size="12" font-weight="700" fill="#c8283c" text-anchor="middle">regressed: restart</text>
<rect x="630" y="322" width="220" height="28" rx="6" fill="#e9eff9" stroke="#185abd" stroke-width="1.8"/>
<text x="740" y="341" font-size="12" font-weight="700" fill="#185abd" text-anchor="middle">fresh quiet tail, e.g. 10 min</text>
