<svg xmlns="http://www.w3.org/2000/svg" width="960" height="626" viewBox="0 0 960 626" role="img" aria-labelledby="timeline-title timeline-desc" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="timeline-title">The caught-up-then-regresses trap</title>
<desc id="timeline-desc">Timeline of one PURGE trial on a 16-file table. QAP reports caught up, then 61 seconds later reports 18 files pending and rereads 577.5 MiB. A naive watcher that stops at the first caught-up reports zero rereads. Our watcher restarts its quiet tail on every regression and then waits for late storage logs.</desc>
<defs>
<marker id="timeline-ar-ink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#526278"/></marker>
<marker id="timeline-ar-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#c8283c"/></marker>
<marker id="timeline-ar-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#185abd"/></marker>
<marker id="timeline-ar-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#1f7a45"/></marker>
<marker id="timeline-ar-amber" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#b78919"/></marker>
<marker id="timeline-ar-purple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#6b3fb5"/></marker>
</defs>
<rect x="1" y="1" width="958" height="624" rx="16" fill="#ffffff" stroke="#d5dfea" stroke-width="1.5"/>
<text x="28" y="46" font-size="25" font-weight="700" fill="#18263a">The trap: “caught up”, then a regression</text>
<text x="28" y="74" font-size="15" fill="#526278">QAP can say it is done, then start over. A watcher that stops at the first “caught up” misses the rereads.</text>
<rect x="20" y="124" width="920" height="60" rx="6" fill="#f7f9fc" stroke="none" stroke-width="0"/>
<text x="30" y="150" font-size="14" font-weight="700" fill="#18263a">Delta log</text>
<text x="30" y="168" font-size="11.5" fill="#526278">one commit</text>
<text x="30" y="210" font-size="14" font-weight="700" fill="#18263a">QAP status</text>
<text x="30" y="228" font-size="11.5" fill="#526278">.show … statistics</text>
<rect x="20" y="244" width="920" height="60" rx="6" fill="#f7f9fc" stroke="none" stroke-width="0"/>
<text x="30" y="270" font-size="14" font-weight="700" fill="#18263a">Naive watcher</text>
<text x="30" y="288" font-size="11.5" fill="#526278">stops at caught up</text>
<text x="30" y="330" font-size="14" font-weight="700" fill="#18263a">Our watcher</text>
<text x="30" y="348" font-size="11.5" fill="#526278">restart on regress</text>
<rect x="20" y="364" width="920" height="60" rx="6" fill="#f7f9fc" stroke="none" stroke-width="0"/>
<text x="30" y="390" font-size="14" font-weight="700" fill="#18263a">Storage reads</text>
<text x="30" y="408" font-size="11.5" fill="#526278">what really happened</text>
<text x="30" y="450" font-size="14" font-weight="700" fill="#18263a">StorageBlobLogs</text>
<text x="30" y="468" font-size="11.5" fill="#526278">what Log Analytics shows</text>
<path d="M210,122 V484" fill="none" stroke="#b8c4d3" stroke-width="1.2" stroke-dasharray="4 4" stroke-linejoin="round"/>
<text x="210" y="116" font-size="12" font-weight="600" fill="#526278" text-anchor="middle">commit</text>
