<text x="328" y="477" font-size="12.5" font-weight="700" fill="#c8283c">2–10 min later →</text>
<path d="M200,498 H936" fill="none" stroke="#526278" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#timeline-ar-ink)"/>
<text x="936" y="518" font-size="12" fill="#526278" text-anchor="end">time (not to scale)</text>
<text x="30" y="518" font-size="12" fill="#526278">Based on run 5 (PURGE, 16-file table): caught up with 9,216 of 9,216 rows accelerated; 61 s later, 18 files pending and 0 rows.</text>
<rect x="24" y="538" width="912" height="66" rx="10" fill="#fff8e6" stroke="#b78919" stroke-width="1.5"/>
<text x="40" y="564" font-size="13" fill="#18263a"><tspan font-weight="700">Run 4 hit the other half of the trap: </tspan><tspan>its window saw 0 rereads, then Log Analytics showed 17 files (609 MiB) read about 3 min after it closed.</tspan></text>
<text x="40" y="586" font-size="13" fill="#18263a"><tspan font-weight="700">Fix: </tspan><tspan>restart the quiet tail on every regression, then wait for late logs before you call anything 0.</tspan></text>
</svg>
