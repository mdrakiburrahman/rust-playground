<text x="320" y="116" font-size="12" font-weight="600" fill="#526278" text-anchor="middle">caught up</text>
<path d="M430,122 V484" fill="none" stroke="#b8c4d3" stroke-width="1.2" stroke-dasharray="4 4" stroke-linejoin="round"/>
<text x="430" y="116" font-size="12" font-weight="600" fill="#526278" text-anchor="middle">+61 s: regressed</text>
