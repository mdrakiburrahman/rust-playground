<text x="480" y="422" font-size="14" font-weight="700" fill="#c8283c" text-anchor="middle">reread: A, B</text>
<text x="480" y="444" font-size="12.5" fill="#526278" text-anchor="middle">expected: only new files, if any</text>
<rect x="24" y="584" width="912" height="70" rx="10" fill="#f4effc" stroke="#6b3fb5" stroke-width="1.5"/>
<text x="40" y="612" font-size="13.5" fill="#18263a"><tspan font-weight="700">Blast radius depends on the packing, and Kusto picks it. </tspan><tspan>A few big extents over many files: one change rereads most</tspan></text>
<text x="40" y="634" font-size="13.5" fill="#18263a">of the table (16-file runs). Small extents over few files: little or nothing is reread (most 2-file runs).</text>
