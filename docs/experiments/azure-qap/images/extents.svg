<svg xmlns="http://www.w3.org/2000/svg" width="960" height="696" viewBox="0 0 960 696" role="img" aria-labelledby="extents-title extents-desc" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="extents-title">Shared extents: why unchanged files get reread</title>
<desc id="extents-desc">Our model of Kusto extents. Panel 1: six files packed into two extents, each spanning two or three partitions. Panel 2: removing file C rebuilds extent 1, so A and B are read again. Panel 3: appending file H only adds extent 3, and nothing old is read again.</desc>
<defs>
<marker id="extents-ar-ink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#526278"/></marker>
<marker id="extents-ar-red" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#c8283c"/></marker>
<marker id="extents-ar-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#185abd"/></marker>
<marker id="extents-ar-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#1f7a45"/></marker>
<marker id="extents-ar-amber" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#b78919"/></marker>
<marker id="extents-ar-purple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#6b3fb5"/></marker>
<symbol id="extents-pq" viewBox="0 0 64 64"><image width="64" height="64" href="data:image/png;base64,"/></symbol>
</defs>
<rect x="1" y="1" width="958" height="694" rx="16" fill="#ffffff" stroke="#d5dfea" stroke-width="1.5"/>
<text x="28" y="46" font-size="25" font-weight="700" fill="#18263a">Why unchanged files get reread: shared extents</text>
<text x="28" y="74" font-size="15" fill="#526278">Our best model. Kusto packs rows from many files, even from different partitions, into one extent.</text>
<text x="28" y="94" font-size="15" fill="#526278">When one of those files leaves the table, the whole extent is rebuilt from the files that are left.</text>
<rect x="24" y="122" width="288" height="372" rx="14" fill="#f7f9fc" stroke="#d5dfea" stroke-width="1.5"/>
<text x="40" y="152" font-size="15" font-weight="700" fill="#18263a">1. Steady state</text>
<text x="28" y="520" font-size="13" fill="#18263a">6 files, 2 extents. Each extent mixes</text>
<text x="28" y="539" font-size="13" fill="#18263a">files from 2 or 3 partitions.</text>
<rect x="336" y="122" width="288" height="372" rx="14" fill="#f7f9fc" stroke="#d5dfea" stroke-width="1.5"/>
<text x="352" y="152" font-size="15" font-weight="700" fill="#18263a">2. A commit removes C</text>
<text x="340" y="520" font-size="13" fill="#18263a">OPTIMIZE or PURGE removes C. Kusto</text>
<text x="340" y="539" font-size="13" fill="#18263a">rebuilds extent 1, so it reads A and B</text>
<text x="340" y="558" font-size="13" fill="#18263a">again, though they did not change.</text>
<rect x="648" y="122" width="288" height="372" rx="14" fill="#f7f9fc" stroke="#d5dfea" stroke-width="1.5"/>
<text x="664" y="152" font-size="15" font-weight="700" fill="#18263a">3. Append H</text>
<text x="652" y="520" font-size="13" fill="#18263a">Appends only add an extent.</text>
<text x="652" y="539" font-size="13" fill="#18263a">Nothing old is read again.</text>
<rect x="38" y="170" width="260" height="98" rx="10" fill="#ffffff" stroke="#c9b8ec" stroke-width="2"/>
<text x="52" y="192" font-size="13" font-weight="700" fill="#6b3fb5">extent 1</text>
<text x="286" y="192" font-size="11.5" fill="#526278" text-anchor="end">2 partitions</text>
<rect x="50" y="204" width="70" height="34" rx="8" fill="#dff4e5" stroke="#25834b" stroke-width="2"/>
<use href="#extents-pq" x="57" y="210" width="22" height="22"/>
<text x="85" y="227" font-size="14.5" font-weight="700" fill="#18263a">A</text>
<text x="85" y="256" font-size="11" fill="#526278" text-anchor="middle">expired</text>
