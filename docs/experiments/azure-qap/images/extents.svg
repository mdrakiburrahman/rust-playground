<text x="249" y="366" font-size="11" fill="#526278" text-anchor="middle">live</text>
<rect x="350" y="170" width="260" height="98" rx="10" fill="#fff5f6" stroke="#c8283c" stroke-width="2"/>
<text x="364" y="192" font-size="13" font-weight="700" fill="#c8283c">extent 1</text>
<text x="598" y="192" font-size="11.5" font-weight="700" fill="#c8283c" text-anchor="end">rebuilt</text>
