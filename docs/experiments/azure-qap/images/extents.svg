<text x="479" y="227" font-size="14.5" font-weight="700" fill="#18263a">B</text>
<text x="479" y="256" font-size="11" fill="#526278" text-anchor="middle">expired</text>
<rect x="526" y="204" width="70" height="34" rx="8" fill="#ffe2e6" stroke="#bf3448" stroke-width="2" stroke-dasharray="6 4"/>
