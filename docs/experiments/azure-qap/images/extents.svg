<text x="910" y="412" font-size="11.5" font-weight="700" fill="#185abd" text-anchor="end">only H is read</text>
<rect x="674" y="424" width="70" height="34" rx="8" fill="#e9eff9" stroke="#185abd" stroke-width="2"/>
