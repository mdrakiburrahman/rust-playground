<text x="52" y="302" font-size="13" font-weight="700" fill="#6b3fb5">extent 2</text>
<text x="286" y="302" font-size="11.5" fill="#526278" text-anchor="end">3 partitions</text>
<rect x="50" y="314" width="70" height="34" rx="8" fill="#dff4e5" stroke="#25834b" stroke-width="2"/>
<use href="#extents-pq" x="57" y="320" width="22" height="22"/>
<text x="85" y="337" font-size="14.5" font-weight="700" fill="#18263a">D</text>
<text x="85" y="366" font-size="11" fill="#526278" text-anchor="middle">compact</text>
<rect x="132" y="314" width="70" height="34" rx="8" fill="#dff4e5" stroke="#25834b" stroke-width="2"/>
<use href="#extents-pq" x="139" y="320" width="22" height="22"/>
<text x="167" y="337" font-size="14.5" font-weight="700" fill="#18263a">E</text>
<text x="167" y="366" font-size="11" fill="#526278" text-anchor="middle">control</text>
<rect x="214" y="314" width="70" height="34" rx="8" fill="#dff4e5" stroke="#25834b" stroke-width="2"/>
<use href="#extents-pq" x="221" y="320" width="22" height="22"/>
