<use href="#extents-pq" x="369" y="210" width="22" height="22"/>
<text x="397" y="227" font-size="14.5" font-weight="700" fill="#18263a">A</text>
<text x="397" y="256" font-size="11" fill="#526278" text-anchor="middle">expired</text>
<rect x="444" y="204" width="70" height="34" rx="8" fill="#ffe2e6" stroke="#c8283c" stroke-width="2"/>
