<text x="561" y="227" font-size="14.5" font-weight="700" fill="#18263a">C</text>
<text x="561" y="256" font-size="11" fill="#526278" text-anchor="middle">compact</text>
<rect x="350" y="280" width="260" height="98" rx="10" fill="#ffffff" stroke="#c9b8ec" stroke-width="2"/>
<text x="364" y="302" font-size="13" font-weight="700" fill="#6b3fb5">extent 2</text>
