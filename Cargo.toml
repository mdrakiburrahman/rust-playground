[workspace]
members = [
    "bin/*",
    "crates/*",
    "projects/arrowcol-rust",
    "projects/arrowcol-router-rust",
    "projects/arrowcol-dataflow-rust",
    "projects/kusto-bridge",
    "projects/kusto-explorer",
    "projects/kusto-explorer/api",
    "projects/kusto-explorer/ui",
    "projects/loadtest/loadgen",
    "projects/loadtest/reader",
    "projects/otelcol-rust",
]
exclude = ["submodules/otel-arrow/rust/otap-dataflow", "submodules/otel-arrow/rust/otap-dataflow/**"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Raki <mdrakiburrahman@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/mdrakiburrahman/rust-playground"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
greeting = { path = "crates/greeting" }
opentelemetry = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "logs", "metrics", "trace"] }
opentelemetry_sdk = "0.31"
predicates = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
clone_on_ref_ptr = "warn"
expect_used = "warn"
large_enum_variant = "warn"
missing_errors_doc = "warn"
unwrap_used = "warn"

# The browser UI ships as WebAssembly, so it is optimized for size rather than speed.
# Dependencies (Arrow, Parquet, compression) run several times faster with basic optimization,
# which keeps the local loadtest's debug-built final compaction inside its 300s budget while
# workspace crates stay fully debuggable.
[profile.dev.package."*"]
opt-level = 1

[profile.release.package.kusto-explorer-ui]
opt-level = "z"
codegen-units = 1
