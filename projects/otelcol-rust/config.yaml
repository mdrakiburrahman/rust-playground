version: otel_dataflow/v1
policies:
  resources:
    memory_limiter:
      mode: enforce
      source: auto
      check_interval: 1s
      retry_after_secs: 5
      fail_readiness_on_hard: true
engine: {}
groups:
  default:
    pipelines:
      main:
        nodes:
          otlp:
            type: receiver:otlp
            config:
              protocols:
                http:
                  listening_addr: "0.0.0.0:4318"
                grpc:
                  listening_addr: "0.0.0.0:4317"
          batch:
            type: processor:batch
            config:
              format: otlp
              max_batch_duration: 200ms
              otlp:
                min_size: 1048576
                max_size: 8388608
                sizer: bytes
          deltalake:
            type: exporter:deltalake
            config:
              storage:
                file:
                  base_uri: /onelake
              writer_options:
                target_rows_per_file: 1000
                flush_when_older_than: 2s
              commit_options:
                batch_window: 10s
                max_files_per_commit: 64
                max_pending_files: 256
        connections:
          - from: otlp
            to: batch
          - from: batch
            to: deltalake
