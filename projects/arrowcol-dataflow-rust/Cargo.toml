[package]
name = "arrowcol-dataflow-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "DFE-based arbitrary Arrow Flight collector"

[dependencies]
arrowcol-buffer = { path = "../../crates/arrowcol-buffer" }
arrow-deltalake = { path = "../../crates/arrow-deltalake" }
