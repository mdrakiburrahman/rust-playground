otel-arrow-dfe-telemetry = { path = "../../submodules/otel-arrow/rust/otap-dataflow/crates/telemetry" }
tracing-subscriber = { workspace = true, features = ["registry"] }
arrowcol-dataflow-components = { path = "../../crates/arrowcol-dataflow-components" }
otel-arrow-dfe = { path = "../../submodules/otel-arrow/rust/otap-dataflow", default-features = false, features = ["durable-buffer", "crypto-ring"] }

[lints]
workspace = true
