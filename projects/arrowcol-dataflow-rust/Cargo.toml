[package]
name = "arrowcol-dataflow-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "DFE-based arbitrary Arrow Flight collector"

[features]
default = []
allocator-mimalloc = ["dep:mimalloc"]

[dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }
arrowcol-buffer = { path = "../../crates/arrowcol-buffer" }
arrow-deltalake = { path = "../../crates/arrow-deltalake" }
delta_kernel = { version = "=0.29.0", default-features = false }
otel-arrow-dfe-telemetry = { path = "../../submodules/otel-arrow/rust/otap-dataflow/crates/telemetry" }
tracing-subscriber = { workspace = true, features = ["registry"] }
serde_json = "1"
arrowcol-dataflow-components = { path = "../../crates/arrowcol-dataflow-components" }
arrowcol-tunables = { path = "../../crates/arrowcol-tunables" }
otel-arrow-dfe = { path = "../../submodules/otel-arrow/rust/otap-dataflow", default-features = false, features = ["durable-buffer", "crypto-ring"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["thread"] }

[lints]
workspace = true
