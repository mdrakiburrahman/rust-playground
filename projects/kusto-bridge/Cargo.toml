[package]
name = "kusto-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Sidecar that keeps local Kusto emulator tables equal to committed Delta snapshots"
readme = "README.md"
publish = false

[dependencies]
anyhow.workspace = true
axum = "0.8"
clap = { workspace = true, features = ["derive", "env"] }
delta_kernel = { version = "=0.29.0", default-features = false, features = ["arrow-58", "internal-api"] }
delta_kernel_default_engine = { version = "=0.29.0", default-features = false, features = ["arrow-58"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
