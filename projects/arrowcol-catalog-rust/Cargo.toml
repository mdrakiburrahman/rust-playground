[package]
name = "arrowcol-catalog-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Standalone Rust Spark SQL schema catalog and resumable CES service"

[dependencies]
anyhow.workspace = true
arrow-array = { version = "58.3", default-features = false }
arrow-flight = { version = "58.3", default-features = false, features = ["flight-sql"] }
arrow-schema = { version = "58.3", default-features = false }
arrow-deltalake = { path = "../../crates/arrow-deltalake" }
arrowcol-catalog = { path = "../../crates/arrowcol-catalog" }
arrowcol-catalog-client = { path = "../../crates/arrowcol-catalog-client" }
arrowcol-protocol = { path = "../../crates/arrowcol-protocol" }
arrowcol-flight = { path = "../../crates/arrowcol-flight" }
arrowcol-props = { path = "../../crates/arrowcol-props" }
arrowcol-sparksql = { path = "../../crates/arrowcol-sparksql" }
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = "0.14"
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
