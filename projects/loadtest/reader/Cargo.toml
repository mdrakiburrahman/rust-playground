[package]
name = "delta-inspect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
hex = "0.4"
parquet = { version = "58.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
deltalake-core = { version = "=1.1.1", default-features = false, features = ["rustls"] }
deltalake-azure = { version = "=1.0.0", default-features = false, features = ["rustls"] }
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
arrow-deltalake = { path = "../../../crates/arrow-deltalake" }
arrow = { version = "58.3", default-features = false }

[lints]
workspace = true
