global:
  scrape_interval: 2s
  scrape_native_histograms: true

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name

storage:
  tsdb:
    out_of_order_time_window: 10m

scrape_configs:
  - job_name: direct
    static_configs:
      - targets: ["direct-1:8081"]
        labels: {arrowcol: direct}

  - job_name: dataflow
    static_configs:
      - targets: ["dataflow-1:32011"]
        labels: {arrowcol: dataflow}

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: kusto-bridge
    static_configs:
      - targets: ["kusto-bridge:9464"]

  - job_name: delta-maintenance
    static_configs:
      - targets: ["delta-maintenance:9467"]

  - job_name: tenant-stream
    static_configs:
      - targets: ["tenant-stream:9094"]
