services:
  sqlserver:
    profiles: ["benchmark"]
    image: arrowcol-loadtest/sqlserver:2022-cu27
    build:
      context: ../arrowcol-infra
      dockerfile: docker/sqlserver/Dockerfile
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: ${SQLSERVER_MEMORY_LIMIT_MB:-16384}
      MSSQL_SA_PASSWORD_FILE: /run/secrets/sqlserver_sa_password
    secrets:
      - sqlserver_sa_password
    ports:
      - "${LOADTEST_BIND_HOST:-127.0.0.1}:${SQLSERVER_PORT:-14333}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/usr/local/bin/sqlserver-healthcheck"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 40s
    networks:
      default:
        ipv4_address: ${LOADTEST_SQL_IP:-10.89.0.2}
    init: true
    stop_grace_period: ${STACK_STOP_SECONDS:-30}s

  database-bootstrap:
    profiles: ["benchmark"]
    image: arrowcol-loadtest/sqlserver:2022-cu27
    build:
      context: ../arrowcol-infra
      dockerfile: docker/sqlserver/Dockerfile
    entrypoint: ["/usr/local/bin/database-bootstrap"]
    command: []
    environment:
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: "1433"
      SQLSERVER_SA_PASSWORD_FILE: /run/secrets/sqlserver_sa_password
      ARROWCOL_APP_PASSWORD_FILE: /run/secrets/arrowcol_app_password
      ARROWCOL_MIGRATOR_PASSWORD_FILE: /run/secrets/arrowcol_migrator_password
    secrets:
      - sqlserver_sa_password
      - arrowcol_app_password
      - arrowcol_migrator_password
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  arrowcol-migrate:
    profiles: ["benchmark"]
    image: arrowcol-loadtest/sqlserver:2022-cu27
    build:
      context: ../arrowcol-infra
      dockerfile: docker/sqlserver/Dockerfile
    entrypoint: ["/usr/local/bin/arrowcol-migrate"]
    command: []
    environment:
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: "1433"
      ARROWCOL_MIGRATOR_PASSWORD_FILE: /run/secrets/arrowcol_migrator_password
    secrets:
      - arrowcol_migrator_password
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  arrowcol-catalog:
    profiles: ["benchmark"]
    image: ghcr.io/mdrakiburrahman/rust-playground/arrowcol-catalog-rust:dev
    pull_policy: never
    init: true
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    command: ["--listen", "0.0.0.0:8817", "--warehouse-root", "${LOADTEST_DATAFLOW_DELTA_ROOT:-/delta/dataflow}",
      "--state-dir", "/state", "--ddl-identity-secret-file", "/run/secrets/internal-hmac"]
    secrets:
      - source: internal_hmac
        target: internal-hmac
    ports:
      - "${LOADTEST_BIND_HOST:-127.0.0.1}:${LOADTEST_CATALOG_PORT:-18817}:8817"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LOADTEST_TRACES_ENDPOINT:-http://lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/catalog-state
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/dataflow
        target: /delta/dataflow
        bind:
          create_host_path: false
    depends_on:
      lgtm:
        condition: service_healthy
    stop_grace_period: 5m
  dataflow-1:
    profiles: ["benchmark"]
    init: true
    image: ghcr.io/mdrakiburrahman/rust-playground/arrowcol-dataflow-rust:dev
    pull_policy: never
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    cpus: ${LOADTEST_CPUS:-2}
    command: ["--num-cores", "${LOADTEST_CPUS:-2}", "--config", "/etc/arrowcol-dataflow-rust/config.yaml"]
    environment:
      ARROWCOL_INSTANCE_KEY: loadtest-dataflow-1
      ARROWCOL_ADVERTISED_FLIGHT_ENDPOINT: ${LOADTEST_DATAFLOW_1_IP:-10.89.0.31}:32010
      ARROWCOL_DELTA_ROOT: ${LOADTEST_DATAFLOW_DELTA_ROOT:-/delta/dataflow}
      ARROWCOL_PARTITION_GRANULARITY: ${ARROWCOL_PARTITION_GRANULARITY:-minute}
      ARROWCOL_LAYOUT_ROW_GROUP_ROWS: ${ARROWCOL_LAYOUT_ROW_GROUP_ROWS:-16384}
      ARROWCOL_LAYOUT_PAGE_ROWS: ${ARROWCOL_LAYOUT_PAGE_ROWS:-2048}
      ARROWCOL_MAX_MESSAGE_BYTES: "33554432"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LOADTEST_TRACES_ENDPOINT:-http://lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "2000"
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/dataflow
        target: /delta/dataflow
        bind:
          create_host_path: false
    secrets:
      - source: arrowcol_app_password
        target: arrowcol-app-password
    depends_on:
      arrowcol-catalog:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${LOADTEST_DATAFLOW_1_IP:-10.89.0.31}
    stop_grace_period: 5m

  oat-client:
    profiles: ["oat"]
    build:
      context: ../..
      dockerfile: projects/arrowcol-oat-rust/Dockerfile.client
    image: arrowcol-oat-client:local
    pull_policy: never
    init: true
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    secrets:
      - source: edge_hmac
        target: edge-hmac
    volumes:
      - type: bind
        source: ${OAT_CONTROL_HOST_PATH:-/dev/null}
        target: /oat-control
        bind:
          create_host_path: false

  oat-pin-init:
    profiles: ["oat"]
    image: arrowcol-oat-client:local
    pull_policy: never
    init: true
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    entrypoint: ["/usr/local/bin/arrowcol-oat-pin-init"]
    command:
      - "--config"
      - "/run/arrowcol-oat/pin-init.json"
      - "--migrator-password-file"
      - "/run/secrets/arrowcol_migrator_password"
    secrets:
      - source: arrowcol_migrator_password
        target: arrowcol_migrator_password
    volumes:
      - type: bind
        source: ${OAT_PIN_INIT_CONFIG_HOST_PATH:-/dev/null}
        target: /run/arrowcol-oat/pin-init.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  kusto:
    profiles: ["benchmark"]
    image: mcr.microsoft.com/azuredataexplorer/kustainer-linux@sha256:51e2250da2faf292de903f871a073eb37d3f2641cf63381b183879d21ebb1013
    # /start-kusto.sh runs Kusto without exec; as PID 1 that bash ignores SIGTERM, so stops end in SIGKILL.
    init: true
    # Serial validation retained a 3.855 GiB baseline and reached the 4 GiB ceiling.
    # Attempt-7 simultaneous benchmark peak 7.811 GiB + 2 GiB = 9.811 GiB.
    # Public ubuntu-24.04 CI has 16 GB RAM and no development workspace container.
    mem_limit: ${KUSTO_MEMORY_LIMIT:-6g}
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "${LOADTEST_BIND_HOST:-127.0.0.1}:${KUSTO_PORT:-8080}:8080"
    volumes:
      - kusto-data:/kustodata
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/dataflow
        target: /delta/dataflow
        read_only: true
        bind:
          create_host_path: false
    networks:
      default:
        ipv4_address: ${LOADTEST_KUSTO_IP:-10.89.0.50}
    stop_grace_period: ${STACK_STOP_SECONDS:-30}s

  # Browser UI for the Kusto emulator. The server reaches Kusto by its Compose service name on this
  # network; browsers only talk to kusto-explorer itself (same-origin /api), never to Kusto.
  kusto-explorer:
    profiles: ["benchmark"]
    image: ghcr.io/mdrakiburrahman/rust-playground/kusto-explorer:dev
    pull_policy: never
    environment:
      KUSTO_EXPLORER_CONNECTIONS: "Loadtest emulator=http://kusto:8080"
      KUSTO_EXPLORER_DEFAULT_DATABASE: loadtest
    ports:
      - "127.0.0.1:${KUSTO_EXPLORER_PORT:-8090}:8080"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      default:
        ipv4_address: ${LOADTEST_KUSTO_EXPLORER_IP:-10.89.0.51}
    stop_grace_period: ${STACK_STOP_SECONDS:-30}s

  # Headless browser for the `--validate` UI gate. It joins this network so the gate exercises the
  # same Docker-internal path (http://kusto-explorer:8080 -> http://kusto:8080). The runner copies
  # its own playwright-core into the container, so the image tag must match package-lock.json.
  playwright:
    profiles: ["ui-gate"]
    image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    user: pwuser
    init: true
    shm_size: 1gb
    command: ["node", "/opt/playwright-core/cli.js", "run-server", "--port", "3000", "--host", "0.0.0.0"]
    networks:
      default:
        ipv4_address: ${LOADTEST_PLAYWRIGHT_IP:-10.89.0.52}
    stop_grace_period: 10s

  lgtm:
    profiles: ["benchmark"]
    image: grafana/otel-lgtm@sha256:57c04cbd8e7022f32bb84c4ac005d79baf8b08e2c5be44facf11f5f1f9944ba2
    networks:
      default:
        ipv4_address: ${LOADTEST_LGTM_IP:-10.89.0.40}
    ports:
      - "${LOADTEST_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/arrowcol.yaml:ro
      - ./observability/arrowcol.json:/otel-lgtm/grafana/conf/provisioning/dashboards/arrowcol/arrowcol.json:ro
      - ./observability/delta-operations.json:/otel-lgtm/grafana/conf/provisioning/dashboards/arrowcol/delta-operations.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  cadvisor:
    profiles: ["benchmark"]
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    command:
      - --docker_only=true
      - --housekeeping_interval=2s
      - --max_housekeeping_interval=2s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    tmpfs:
      - /var/lib/cadvisor:size=64m,mode=0755
    networks:
      default:
        ipv4_address: ${LOADTEST_CADVISOR_IP:-10.89.0.105}

  # Docker UI (logs, stats, shells). tmpfs /data re-seeds the admin from the SA password on every start.
  portainer:
    profiles: ["benchmark"]
    image: portainer/portainer-ce:2.45.2@sha256:03f94a406496dc84d37b552795fc424ccad8d0d7200353b6a82915f6e8f73ab0
    command:
      - --admin-password-file=/run/secrets/sqlserver_sa_password
      - --host=unix:///var/run/docker.sock
    secrets:
      - sqlserver_sa_password
    ports:
      - "127.0.0.1:${PORTAINER_PORT:-9444}:9443"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    tmpfs:
      - /data:size=128m,mode=0700
    networks:
      default:
        ipv4_address: ${LOADTEST_PORTAINER_IP:-10.89.0.106}

  router:
    profiles: ["benchmark"]
    image: ghcr.io/mdrakiburrahman/rust-playground/arrowcol-router-rust:dev
    pull_policy: never
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    command: ["--config", "/state/config.yaml"]
    ports:
      - "${LOADTEST_BIND_HOST:-127.0.0.1}:${LOADTEST_ROUTER_PORT:-15050}:50050"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LOADTEST_TRACES_ENDPOINT:-http://lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    secrets:
      - source: arrowcol_app_password
        target: arrowcol-app-password
      - source: edge_hmac
        target: edge-hmac
      - source: internal_hmac
        target: internal-hmac
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/router-state
        target: /state
        bind:
          create_host_path: false
    depends_on:
      dataflow-1:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${LOADTEST_ROUTER_IP:-10.89.0.10}
    stop_grace_period: 5m

  delta-maintenance:
    profiles: ["maintenance"]
    init: true
    image: ghcr.io/mdrakiburrahman/rust-playground/delta-maintenance:dev
    pull_policy: never
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    command:
      - --root
      - ${LOADTEST_MAINTENANCE_ROOT:-file:///tmp/arrowcol-stress/dataflow/telemetry/sqlserver/}
      - --table
      - sqlserver_cpu_utilization
      - --operation
      - optimize
      - --operation
      - checkpoint
      - --checkpoint-every-commits
      - "${LOADTEST_CHECKPOINT_EVERY_COMMITS:-100}"
      - --apply
      - --interval-secs
      - "30"
      - --max-idle-backoff-secs
      - "30"
      - --max-cycles
      - "10"
      - --operation-timeout-secs
      - "60"
      - --listen
      - "0.0.0.0:9467"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${LOADTEST_TRACES_ENDPOINT:-http://lgtm:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRIC_EXPORT_INTERVAL: "2000"
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/dataflow
        target: /tmp/arrowcol-stress/dataflow
        bind:
          create_host_path: false
    stop_grace_period: 5m

  tenant-stream:
    profiles: ["tenant"]
    init: true
    image: ghcr.io/mdrakiburrahman/rust-playground/arrow-tenant-stream:dev
    pull_policy: never
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    command:
      - --source
      - ${LOADTEST_TENANT_SOURCE:-file:///delta/dataflow/telemetry/sqlserver/sqlserver_cpu_utilization}
      - --target
      - ${LOADTEST_TENANT_TARGET:-file:///delta/tenant/sqlserver_cpu_utilization}
      - --checkpoint
      - ${LOADTEST_TENANT_CHECKPOINT:-file:///checkpoints/tenant-cpu}
      - --customer-id
      - customer-0000
      - --metrics-listen
      - "0.0.0.0:9094"
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/dataflow
        target: /delta/dataflow
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/tenant
        target: /delta/tenant
        bind:
          create_host_path: false
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/tenant-checkpoints
        target: /checkpoints
        bind:
          create_host_path: false
    stop_grace_period: 5m

  validator:
    profiles: ["benchmark"]
    image: ghcr.io/mdrakiburrahman/rust-playground/arrowcol-router-rust:dev
    pull_policy: never
    user: "${LOADTEST_UID:?Run through Nx}:${LOADTEST_GID:?Run through Nx}"
    entrypoint: ["/usr/local/bin/arrowcol-loadgen"]
    command: ["validate"]
    working_dir: /workspace
    environment:
      LOADTEST_RESULTS: /results
      LOADTEST_DATAFLOW_ROOT: /delta/dataflow
      LOADTEST_DRAIN_TIMEOUT: ${LOADTEST_DRAIN_TIMEOUT:-8m}
      LOADTEST_KUSTO_ENDPOINT: http://${LOADTEST_KUSTO_IP:-10.89.0.50}:8080
    volumes:
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/results
        target: /results
        bind:
          create_host_path: false
      - type: bind
        source: ${ONELAKE_HOST_PATH:?Run through Nx}/dataflow
        target: /delta/dataflow
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LOADTEST_BIN_HOST_PATH:?Run through benchmark target}/arrowcol-loadgen
        target: /usr/local/bin/arrowcol-loadgen
        read_only: true
        bind:
          create_host_path: false

secrets:
  sqlserver_sa_password:
    file: ${SQLSERVER_SA_PASSWORD_FILE:-/dev/null}
  arrowcol_app_password:
    file: ${ARROWCOL_APP_PASSWORD_FILE:-/dev/null}
  arrowcol_migrator_password:
    file: ${ARROWCOL_MIGRATOR_PASSWORD_FILE:-/dev/null}
  edge_hmac:
    file: ${LOADTEST_EDGE_HMAC_FILE:-/dev/null}
  internal_hmac:
    file: ${LOADTEST_INTERNAL_HMAC_FILE:-/dev/null}

volumes:
  sqlserver-data:
  kusto-data:
    labels:
      io.arrowcol.loadtest.workspace: ${LOADTEST_WORKSPACE:?Run through Nx}

networks:
  default:
    ipam:
      config:
        - subnet: ${LOADTEST_SUBNET:-10.89.0.0/24}
