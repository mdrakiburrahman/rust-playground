[package]
name = "arrowcol-loadgen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic many-table Arrow Flight benchmark and validator"
publish = false

[dependencies]
anyhow.workspace = true
arrow = { version = "58.3", default-features = false, features = ["ipc"] }
arrow-flight = { version = "58.3", default-features = false, features = ["flight-sql"] }
arrow-ipc = { version = "58.3", default-features = false }
arrow-schema = { version = "58.3", default-features = false }
arrow-deltalake = { path = "../../../crates/arrow-deltalake" }
arrowcol-catalog = { path = "../../../crates/arrowcol-catalog" }
arrowcol-flight = { path = "../../../crates/arrowcol-flight" }
arrowcol-protocol = { path = "../../../crates/arrowcol-protocol" }
arrowcol-routing = { path = "../../../crates/arrowcol-routing" }
base64 = "0.22"
bytes = "1"
clap = { workspace = true, features = ["derive", "env"] }
delta-inspect = { path = "../reader" }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.14"
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
# Dev-only: enables the offline bootstrap control seam for tests/initialize_control.rs.
arrow-deltalake = { path = "../../../crates/arrow-deltalake", features = ["test-control"] }
assert_cmd.workspace = true
async-trait = "0.1"
object_store = "0.13.2"
predicates.workspace = true

[lints]
workspace = true
