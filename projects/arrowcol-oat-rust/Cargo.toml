[package]
name = "arrowcol-oat-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust OAT benchmark server for ArrowCol"
publish = false

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
arrow = { version = "58.3", default-features = false }
arrowcol-protocol = { path = "../../crates/arrowcol-protocol" }
arrowcol-routing = { path = "../../crates/arrowcol-routing" }
arrow-deltalake = { path = "../../crates/arrow-deltalake" }
arrowcol-loadgen = { path = "../loadtest/loadgen" }
chrono = "0.4"
axum = "0.8"
clap.workspace = true
collector-chain = { path = "../../bin/collector-chain" }
futures-util = "0.3"
fs2 = "0.4.3"
object_store = { version = "0.13.2", features = ["azure"] }
parquet = { version = "58.3", default-features = false, features = ["arrow"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
