[package]
name = "arrowcol-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Production direct Arrow Flight to Delta collector"
readme = "README.md"
publish = false

[dependencies]
anyhow.workspace = true
arrow = { version = "58.3", default-features = false, features = ["ipc"] }
arrow-flight = { version = "58.3", default-features = false, features = ["flight-sql"] }
arrowcol-buffer = { path = "../../crates/arrowcol-buffer" }
arrowcol-catalog = { path = "../../crates/arrowcol-catalog" }
arrowcol-flight = { path = "../../crates/arrowcol-flight" }
arrowcol-protocol = { path = "../../crates/arrowcol-protocol" }
arrowcol-receipts = { path = "../../crates/arrowcol-receipts" }
arrowcol-routing = { path = "../../crates/arrowcol-routing" }
arrowcol-sql-server = { path = "../../crates/arrowcol-sql-server" }
arrow-deltalake = { path = "../../crates/arrow-deltalake" }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { workspace = true, features = ["derive"] }
futures = "0.3"
hmac = "0.12"
http = "1"
prometheus = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
thiserror.workspace = true
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
tonic = { version = "0.14", features = ["tls-ring"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
delta_kernel = { version = "=0.29.0", default-features = false }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd.workspace = true
parquet = { version = "58.3", default-features = false, features = ["arrow"] }
predicates.workspace = true
tempfile = "3"
tiberius = { version = "0.13", default-features = false, features = ["rustls", "tds73"] }

[lints]
workspace = true
