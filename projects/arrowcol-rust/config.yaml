flight:
  bind: 127.0.0.1:50051
  advertised_endpoint: 127.0.0.1:50051
  max_concurrent_streams: 256
  max_metadata_bytes: 16384
  max_schema_bytes: 1048576
  max_message_bytes: 16777216
  batch_channel_capacity: 4
  put_result_channel_capacity: 16
  max_stream_duration_ms: 300000
  admission_timeout_ms: 30000
  max_ddl_bytes: 65536
  tls:
    enabled: false
    certificate_file: null
    private_key_file: null
    client_ca_file: null

admin:
  bind: 127.0.0.1:8081
  max_receipt_ids: 256

identity:
  instance_id: null
  instance_key: local-direct-1
  generation: 1
  implementation_pool: direct
  host_name: local
  build_version: development

sql_server:
  host: 127.0.0.1
  port: 14333
  database: arrowcol
  username: arrowcol_app
  password_file: projects/arrowcol-infra/secrets/arrowcol-app-password.txt
  trust_server_certificate: true
  connect_timeout_ms: 5000
  command_timeout_ms: 15000
  pool:
    receipts_max_size: 16
    routing_max_size: 4
    catalog_max_size: 4
    acquire_timeout_ms: 5000

hive:
  host: 127.0.0.1
  port: 9083
  warehouse_root: file:///opt/hive/data/warehouse
  owner: arrowcol
  connect_timeout_ms: 5000

delta:
  root: projects/arrowcol-rust/.data/delta
  commit_batch_window_ms: 10000
  max_files_per_commit: 64
  max_pending_files: 256

buffer:
  global_capacity:
    bytes: 2147483648
    rows: 10000000
    batches: 4096
  per_table_capacity:
    bytes: 536870912
    rows: 2000000
    batches: 1024
  max_arrow_memory_per_flush: 536870912
  max_rows_per_flush: 1000000
  max_batches_per_flush: 512
  max_age_ms: 30000
  age_check_interval_ms: 250
  max_concurrent_flushes: 4
  receipt_lease_duration_ms: 60000
  adaptive_file:
    target_parquet_bytes: 134217728
    min_input_bytes: 16777216
    max_input_bytes: 1073741824
    cold_start_parquet_ratio: 0.25
    ewma_weight: 0.2
    min_parquet_ratio: 0.015625
    max_parquet_ratio: 4.0
  native_quiver:
    enabled: false
    directory: null
    capacity_bytes: null

routing:
  require_lease_headers: true
  registration_ttl_ms: 30000
  registration_heartbeat_ms: 5000
  pressure_interval_ms: 1000
  dependency_probe_interval_ms: 5000
  rss_limit_bytes: 4294967296
  max_table_entries: 256
  max_snapshot_age_ms: 15000
  max_future_skew_ms: 2000

receipts:
  owner_lease_ttl_ms: 30000
  owner_heartbeat_ms: 5000
  table_lease_ttl_ms: 30000
  table_lease_renew_ms: 5000
  receipt_lease_duration_ms: 20000
  admission_timeout_ms: 30000
  mutation_batch_size: 256
  status_batch_size: 256
  reconciliation_batch_size: 256

auth:
  mode: router_hmac
  internal_hmac_secret_file: projects/arrowcol-router-rust/secrets/internal-hmac.txt
  internal_identity_max_ttl_ms: 30000
  bearer_token_file: null
  allow_all_subject: null

shutdown:
  # Stream plus publication drain stays well inside the 300 s supervisor stop budget.
  stream_drain_timeout_ms: 60000
  publication_drain_timeout_ms: 180000

telemetry:
  log_filter: info,arrowcol_rust=debug
  json_logs: true
