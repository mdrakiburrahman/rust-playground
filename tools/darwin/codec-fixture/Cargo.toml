[package]
name = "darwin-codec-fixture"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
arrow = { version = "58.3", default-features = false, features = ["ipc"] }
arrow-deltalake = { path = "../../../crates/arrow-deltalake" }
arrowcol-tunables = { path = "../../../crates/arrowcol-tunables" }
collector-chain = { path = "../../../bin/collector-chain" }
parquet = { version = "58.3", default-features = false, features = ["arrow", "zstd", "snap", "lz4", "brotli", "flate2-zlib-rs"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
