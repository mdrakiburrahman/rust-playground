name: toy
agents:
  - provider: copilot
    timeout: 900
    models:
      - name: claude-sonnet-5
samplers:
  - provider: islands
executor:
  parallelism: 1
  termination:
    max_iterations: 1
evaluator:
  metrics:
    score: !eval "float(stdout[-1])"
  commands:
    - /usr/bin/printf 1
prompt:
  system: "No inference; exercise only the local default executor."
