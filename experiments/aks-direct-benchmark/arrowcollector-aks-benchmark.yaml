apiVersion: apps/v1
kind: Deployment
metadata:
  name: arrowcol-sql
  namespace: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    benchmark-stage: sql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arrowcol-sql
  template:
    metadata:
      labels:
        app: arrowcol-sql
        app.kubernetes.io/part-of: arrowcol-oat
    spec:
      serviceAccountName: arrow-collector
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.azure.com/agentpool: benche64
        arrow-collector/role: arrowcol
        kubernetes.io/arch: amd64
      tolerations:
        - key: arrow-collector/role
          operator: Equal
          value: arrowcol
          effect: NoSchedule
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 360
      containers:
        - name: sqlserver
          image: BENCHREGISTRY/arrowcol-sqlserver@sha256:aff04c8f796e13d1789dabd2c019efc0f313bfc87c372d641a2ef8f546b468a3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "2048"
            - name: MSSQL_SA_PASSWORD_FILE
              value: /run/sa/password
          ports:
            - containerPort: 1433
          resources:
            requests:
              cpu: "1"
              memory: 3Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            exec:
              command:
                - /usr/local/bin/sqlserver-healthcheck
            timeoutSeconds: 8
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/sqlserver-healthcheck
            timeoutSeconds: 8
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
              readOnly: false
            - name: sa
              mountPath: /run/sa
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: arrowcol-sql-fresh
        - name: sa
          secret:
            secretName: arrowcol-sql-admin
            defaultMode: 288
---
apiVersion: batch/v1
kind: Job
metadata:
  name: arrowcol-migrate-v11-fresh
  namespace: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    benchmark-stage: migration
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: arrowcol-migrate
        app.kubernetes.io/part-of: arrowcol-oat
    spec:
      serviceAccountName: arrow-collector
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.azure.com/agentpool: benche64
        arrow-collector/role: arrowcol
        kubernetes.io/arch: amd64
      tolerations:
        - key: arrow-collector/role
          operator: Equal
          value: arrowcol
          effect: NoSchedule
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 360
      containers:
        - name: migrate
          image: BENCHREGISTRY/arrowcol-sqlserver@sha256:aff04c8f796e13d1789dabd2c019efc0f313bfc87c372d641a2ef8f546b468a3
          command:
            - /usr/local/bin/arrowcol-migrate
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: SQLSERVER_HOST
              value: arrowcol-sql
            - name: ARROWCOL_MIGRATOR_PASSWORD_FILE
              value: /run/migration/password
          volumeMounts:
            - name: migration
              mountPath: /run/migration
              readOnly: true
      volumes:
        - name: sa
          secret:
            secretName: arrowcol-sql-admin
            defaultMode: 288
        - name: app
          secret:
            secretName: arrowcol-sql-runtime
            defaultMode: 288
        - name: migration
          secret:
            secretName: arrowcol-sql-migration
            defaultMode: 288
      restartPolicy: Never
      initContainers:
        - name: bootstrap
          image: BENCHREGISTRY/arrowcol-sqlserver@sha256:aff04c8f796e13d1789dabd2c019efc0f313bfc87c372d641a2ef8f546b468a3
          command:
            - /usr/local/bin/database-bootstrap
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: SQLSERVER_HOST
              value: arrowcol-sql
            - name: SQLSERVER_SA_PASSWORD_FILE
              value: /run/sa/password
            - name: ARROWCOL_APP_PASSWORD_FILE
              value: /run/app/password
            - name: ARROWCOL_MIGRATOR_PASSWORD_FILE
              value: /run/migration/password
          volumeMounts:
            - name: sa
              mountPath: /run/sa
              readOnly: true
            - name: app
              mountPath: /run/app
              readOnly: true
            - name: migration
              mountPath: /run/migration
              readOnly: true
