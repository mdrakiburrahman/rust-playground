# Direct ArrowCollector benchmark for AKS context arrow-collector-68590.
# A staged deployment, not a single apply. Use only a new isolated benchmark namespace.
# Collector-stack pods are pinned to benche64; the role label also matches other stamp pools.
# Render BENCHRUNUUID as a fresh lowercase UUID and BENCHRUNHEX as its 32 lowercase hex digits.
# Render BENCHOWNER as the approved custody owner in both identity annotations and labels.
# 9876543210000 is a placeholder, not a usable expiry. Immediately before applying
# the initializer stage, replace it in rendered.yaml with current UTC Unix ms + 2700000
# (45 minutes; within the configured 1-hour maximum). Do not compute it at initial
# render if identity/SQL startup will consume that budget. Wait for initializer completion.
# Validate the selected Delta root is empty; never reuse an old run UUID or delete its data.
# Before workload apply, use the sanctioned run-FIC prepare/probe in docs/operations/OAT_RUN_AUTHORITY.md
# for this exact namespace UID and arrow-collector ServiceAccount; cleanup removes that FIC.
# From the repo root, set UUID to the rendered run ID and NS to arrow-collector-<UUID without hyphens>.
# Set BOOTSTRAP_ENV and STAMP_CONFIG to approved private input files for this stamp.
# Set FIC_RECORD to a durable private path unique to this run (retain it through cleanup).
# npx --no-install tsx infra/azure/bootstrap.ts prepare-run-fic --mode stamped --env-file "$BOOTSTRAP_ENV" --stamp-config "$STAMP_CONFIG" --run-id "$UUID" --namespace "$NS" --service-account arrow-collector --record "$FIC_RECORD"
# npx --no-install tsx infra/azure/bootstrap.ts probe-run-fic --mode stamped --env-file "$BOOTSTRAP_ENV" --stamp-config "$STAMP_CONFIG" --run-id "$UUID" --namespace "$NS" --service-account arrow-collector --record "$FIC_RECORD" --wait-seconds 300
# Do not use the unrelated native namespace or copy its credentials. The stamp workload identity
# client/tenant IDs below are identifiers, not credentials. The ACR, Azure storage and pools
# benche64/benchd64 must already exist and the workload identity must have sanctioned access.
# Supply Secrets in this namespace from your approved secret source (no values in this file):
# arrowcol-generation[generation] (current stamp authority generation), arrowcol-router-auth
# [edge-hmac,internal-hmac], arrowcol-sql-{admin,migration,runtime}[password] (fresh generated SQL credentials).
# Apply with: kubectl --context arrow-collector-68590 apply --server-side -f rendered.yaml -l benchmark-stage=STAGE
# Stages, in order (wait for success; abort on failure):
# identity -> prepare/probe FIC and install Secrets -> sql (wait deploy/arrowcol-sql) -> migration
# (wait job/arrowcol-migrate-v11-fresh) -> catalog (wait catalog/router/maintenance deployments)
# -> writer (one ready pod and stable restart count) -> initializer (wait job/direct-pin-live)
# -> registration (wait job/direct-catalog-verified and verify signed one-table receipt)
# -> load (one job; wait for OAT_CLIENT_READY in job/direct-load-confirmwide logs, then patch
# direct-schedule-confirmwide .data.start to Unix ms at least 125 s in the future). Monitor the same writer
# pod UID/restart count throughout; stop this load Job if the writer becomes unhealthy.
# Capture 60 s warmup, 600 s timed commits, then drain. The Job has a hard deadline.
# No QAP/Kusto consumer is deployed here. Use owned UID-bound namespace and FIC cleanup after
# stopping load, preserving all Delta objects; verify workload pools physically return to zero.
# Isolated development benchmark only, not a production deployment or authentication recipe.
# HMAC-authenticated internal traffic is not TLS; retain the supplied workload identity,
# Secrets and network policies. native_quiver is false (memory-only buffering).
# Diagnostic shared replay of synthetic rows, not realistic telemetry or unique-row delivery.
---
apiVersion: v1
kind: Namespace
