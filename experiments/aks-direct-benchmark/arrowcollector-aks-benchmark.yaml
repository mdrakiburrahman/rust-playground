apiVersion: apps/v1
kind: Deployment
metadata:
  name: arrowcol-catalog
  namespace: arrow-collector-BENCHRUNHEX
  labels:
    app.kubernetes.io/part-of: arrowcol-oat
    benchmark-stage: catalog
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arrowcol-catalog
  template:
    metadata:
      labels:
        app: arrowcol-catalog
        app.kubernetes.io/part-of: arrowcol-oat
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: arrow-collector
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.azure.com/agentpool: benche64
        arrow-collector/role: arrowcol
        kubernetes.io/arch: amd64
      tolerations:
        - key: arrow-collector/role
          operator: Equal
          value: arrowcol
          effect: NoSchedule
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 360
      containers:
        - name: catalog
          image: BENCHREGISTRY/arrowcol-catalog-rust@sha256:18145cc2012cc82a5d23b1107e3c5850a520244cd15a23baf41c3be4b3ab6247
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --warehouse-root
            - abfss://arrowcol@BENCHSTORAGEACCOUNT.dfs.core.windows.net/direct-baseline-1/runs/BENCHRUNUUID/dataflow
            - --state-dir
            - /data/catalog
            - --ingestion-layout
