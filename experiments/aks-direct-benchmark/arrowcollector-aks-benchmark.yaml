        arrow-collector/role: arrowcol
        kubernetes.io/arch: amd64
      tolerations:
        - key: arrow-collector/role
          operator: Equal
          value: arrowcol
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: arrowcol-router
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 360
      containers:
        - name: router
          image: BENCHREGISTRY/arrowcol-router-rust@sha256:ca3ea23a471f4c2199c8b25f0acfe737aa3056c09a474616222fa7ac033a24ec
          securityContext:
            runAsNonRoot: true
