          env:
            - name: ARROWCOL_DELTA_ROOT
              value: BENCHDELTA_ROOT
            - name: ARROWCOL_AZURE_MODE
              value: stamped
            - name: AZURE_SUBSCRIPTION_ID
              value: BENCHSUBSCRIPTION
            - name: AZURE_STAMP
