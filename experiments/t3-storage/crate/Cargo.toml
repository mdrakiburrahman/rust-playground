[package]
name = "storage-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
arrow-array = "59"
arrow-schema = "59"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
httpdate = "1"
libc = "0.2"
otel-arrow-dfe-quiver = { git = "https://github.com/ethanmoffat/otel-arrow", tag = "arrowcol-20261112", default-features = false, features = ["mmap"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
