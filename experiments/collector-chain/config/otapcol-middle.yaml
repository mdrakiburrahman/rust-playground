version: otel_dataflow/v1
engine: {}
groups:
  default:
    pipelines:
      main:
        nodes:
          otlp:
            type: receiver:otlp
            config:
              protocols:
                http:
                  listening_addr: "0.0.0.0:4318"
                grpc:
                  listening_addr: "0.0.0.0:4317"
          forward:
            type: exporter:otap
            config:
              grpc_endpoint: "http://otapcol-gateway:4317"
        connections:
          - from: otlp
            to: forward
